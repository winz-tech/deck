<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1200px;height:630px;background:#101014;overflow:hidden;position:relative;
  font-family:"Noto Sans CJK TC","Noto Sans TC",sans-serif;color:#fff}
.grid{position:absolute;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.030) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.030) 1px,transparent 1px);
  background-size:56px 56px;
  -webkit-mask-image:radial-gradient(ellipse 80% 75% at 42% 45%,#000 25%,transparent 82%)}
.glow{position:absolute;inset:0;
  background:radial-gradient(760px 460px at 12% 0%,rgba(227,6,19,.20),transparent 62%),
             radial-gradient(620px 420px at 100% 100%,rgba(227,6,19,.12),transparent 58%)}
.slash{position:absolute;right:-190px;top:-120px;width:620px;height:900px;
  transform:skewX(-18deg);background:linear-gradient(160deg,rgba(227,6,19,.92),rgba(143,0,9,.62))}
.slash2{position:absolute;right:230px;top:-120px;width:26px;height:900px;
  transform:skewX(-18deg);background:rgba(255,255,255,.14)}
.bar{position:absolute;left:0;top:0;bottom:0;width:16px;background:#E30613}
.cnr{position:absolute;width:40px;height:40px;border:3px solid rgba(227,6,19,.75)}
.cnr.tl{top:34px;left:44px;border-right:none;border-bottom:none}
.cnr.bl{bottom:34px;left:44px;border-right:none;border-top:none}
.wrap{position:absolute;left:96px;top:0;bottom:0;width:672px;
  display:flex;flex-direction:column;justify-content:center}
.eb{font-family:"Chakra Petch","Noto Sans CJK TC",sans-serif;font-weight:700;font-size:23px;
  letter-spacing:9px;color:#E30613;margin-bottom:16px}
h1{font-size:82px;font-weight:900;line-height:1.16;letter-spacing:2px}
.rule{width:150px;height:11px;background:#E30613;transform:skewX(-18deg);margin:30px 0 26px}
.sub{font-size:29px;color:#B4B4BE;line-height:1.55}
.tags{display:flex;gap:12px;margin-top:34px}
.tag{border:1.5px solid rgba(255,255,255,.26);border-radius:4px;padding:9px 20px;
  font-size:20px;color:#DADAE2;transform:skewX(-18deg)}
.tag i{display:block;transform:skewX(18deg);font-style:normal}
.tag.hot{border-color:#E30613;background:rgba(227,6,19,.20);color:#fff;font-weight:700}
.right{position:absolute;right:76px;top:0;bottom:0;width:330px;z-index:3;
  display:flex;flex-direction:column;align-items:flex-end;justify-content:center;text-align:right}
.brand{font-size:46px;font-weight:900;letter-spacing:4px;line-height:1.3}
.brand small{display:block;font-family:"Chakra Petch","Noto Sans CJK TC",sans-serif;
  font-size:17px;font-weight:700;letter-spacing:6px;color:rgba(255,255,255,.75);margin-top:10px}
.rline{width:96px;height:6px;background:rgba(255,255,255,.85);transform:skewX(-18deg);
  margin:22px 0 18px}
.when{font-size:21px;letter-spacing:5px;color:rgba(255,255,255,.92);font-weight:700}
</style></head><body>
<div class="grid"></div><div class="glow"></div>
<div class="slash"></div><div class="slash2"></div>
<div class="bar"></div><div class="cnr tl"></div><div class="cnr bl"></div>
<div class="wrap">
  <div class="eb">// WINZ TECHNOLOGY</div>
  <h1>公司的系統，<br>其實比你想的好用</h1>
  <div class="rule"></div>
  <div class="sub">十分鐘，帶你把每天會用到的<br>都走過一遍</div>
  <div class="tags">
    <span class="tag hot"><i>打卡系統</i></span>
    <span class="tag hot"><i>作業中心</i></span>
    <span class="tag"><i>手機也能看</i></span>
  </div>
</div>
<div class="right">
  <div class="brand">穎利科技<small>WINZ TECHNOLOGY</small></div>
  <div class="rline"></div>
  <div class="when">內部系統教育訓練</div>
</div>
</body></html>

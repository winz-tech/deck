      rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --red:#E30613; --ink:#16161A; --paper:#F7F6F4; --dark:#101014;
  --sub:#6B6B75; --line:#DEDCD8;
  --done:#1F7A4D; --doing:#C8811A;
  --zh:'Noto Sans TC','Microsoft JhengHei',sans-serif;
  --en:'Chakra Petch','Microsoft JhengHei',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden;font-family:var(--zh)}

#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{width:1600px;height:900px;position:relative;transform-origin:center center;
  background:var(--paper);overflow:hidden;flex:none}

/* ---------- 共用版面 ---------- */
.slide{position:absolute;inset:0;display:none;flex-direction:column;padding:56px 90px 132px}
.slide.on{display:flex}
.slide.dark{background:var(--dark)}

.eyebrow{font-family:var(--en);font-weight:700;font-size:20px;letter-spacing:6px;
  color:var(--red);text-transform:uppercase;margin-bottom:10px}
.h1{font-size:64px;font-weight:900;color:var(--ink);line-height:1.18;letter-spacing:-1px}
.lead{font-size:26px;color:var(--sub);margin-top:16px;line-height:1.6}
.rule{width:120px;height:8px;background:var(--red);transform:skewX(-18deg);margin:26px 0 34px}

/* 封面 / 分段（深色） */
.dark .h1{color:#fff}
.dark .lead{color:#9A9AA6}
.cover-wrap{margin:auto 0;max-width:1200px}
.cover-title{font-size:88px;font-weight:900;color:#fff;line-height:1.16;letter-spacing:-2px}
.cover-sub{font-size:29px;color:#B9B9C4;margin-top:28px;line-height:1.6}
.cover-foot{position:absolute;left:90px;bottom:56px;font-family:var(--en);
  font-size:17px;letter-spacing:4px;color:#5A5A66}
.bigno{position:absolute;right:80px;bottom:30px;font-family:var(--en);font-weight:700;
  font-size:280px;color:rgba(227,6,19,.16);line-height:.8;letter-spacing:-10px}

/* 條列 */
.items{display:grid;gap:calc(20px*var(--k,1));align-content:start;flex:1;min-height:0;overflow:hidden;min-width:0}
.items.two{grid-template-columns:1fr 1fr;gap:calc(20px*var(--k,1)) 40px}
.item{display:flex;gap:20px;align-items:flex-start;
  border-left:6px solid var(--line);padding:calc(10px*var(--k,1)) 0 calc(10px*var(--k,1)) 22px}
.item .idx{font-family:var(--en);font-weight:700;font-size:20px;color:var(--red);
  padding-top:6px;flex:none;width:34px}
.item h3{font-size:calc(31px*var(--k,1));font-weight:900;color:var(--ink);line-height:1.35}
.item p{font-size:calc(24px*var(--k,1));color:var(--sub);line-height:1.6;margin-top:6px}

/* 逐步展開 */
.step{opacity:0;transform:translateY(16px);transition:opacity .32s ease,transform .32s ease}
.step.shown{opacity:1;transform:none}
.item.shown{border-left-color:var(--red)}

/* 待補頁 */
.todo-box{margin:auto;text-align:center}
.todo-box .tag{display:inline-block;font-family:var(--en);font-weight:700;font-size:18px;
  letter-spacing:4px;color:#fff;background:var(--doing);padding:8px 20px;
  transform:skewX(-18deg);margin-bottom:26px}
.todo-box .tag span{display:block;transform:skewX(18deg)}

/* 頁尾 */
.foot{position:absolute;left:90px;right:90px;bottom:30px;display:flex;align-items:center;
  border-top:1px solid var(--line);padding-top:14px;
  font-family:var(--en);font-size:15px;letter-spacing:2px;color:#9A9AA2}
.slide.dark .foot{border-color:rgba(255,255,255,.12);color:#5A5A66}
.foot .r{margin-left:auto;display:flex;gap:22px;align-items:center}
.foot .pill{background:var(--red);color:#fff;padding:3px 12px;transform:skewX(-18deg)}
.foot .pill span{display:block;transform:skewX(18deg)}

/* ---------- 迎賓頁 ---------- */
#routes{position:absolute;inset:0;background:var(--dark);display:none;
  flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden}
#routes.on{display:flex}
.wl-grid{position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
  background-size:64px 64px;
  -webkit-mask-image:radial-gradient(ellipse 70% 62% at 50% 46%,#000 20%,transparent 80%);
          mask-image:radial-gradient(ellipse 70% 62% at 50% 46%,#000 20%,transparent 80%)}
.wl-slash{position:absolute;left:50%;top:46%;width:220vmax;height:2px;
  transform:translate(-50%,-50%) rotate(-18deg);pointer-events:none;
  background:linear-gradient(90deg,transparent,var(--red),transparent);
  animation:wlPulse 3s ease-in-out infinite}
@keyframes wlPulse{0%,100%{opacity:.22}50%{opacity:.7}}
.wl{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center}
.wl-logo{height:96px;margin-bottom:30px;filter:drop-shadow(0 0 26px rgba(227,6,19,.35))}
.wl-eb{font-family:var(--en);font-weight:700;font-size:17px;letter-spacing:9px;
  color:var(--red);text-transform:uppercase;margin-bottom:16px}
.wl-t{font-size:62px;font-weight:900;color:#fff;letter-spacing:2px;line-height:1.25}
.wl-s{font-size:24px;color:#8A8A96;margin-top:14px;letter-spacing:1px}
.wl-start{margin-top:52px;border:none;cursor:pointer;font-family:var(--zh);
  background:linear-gradient(135deg,var(--red),#8f0009);transform:skewX(-18deg);
  padding:0;border-radius:8px;box-shadow:0 0 34px rgba(227,6,19,.45);position:relative;
  animation:wlBreath 2.6s ease-in-out infinite}
.wl-start::before{content:'';position:absolute;inset:5px;border:1px solid rgba(255,255,255,.32);
  border-radius:5px;pointer-events:none}
.wl-start span{display:block;transform:skewX(18deg);padding:22px 76px;color:#fff;
  font-family:var(--en);font-weight:700;font-size:34px;letter-spacing:12px}
.wl-start:hover{box-shadow:0 0 48px rgba(227,6,19,.75)}
.wl-start:active{transform:skewX(-18deg) translateY(3px)}
@keyframes wlBreath{0%,100%{box-shadow:0 0 26px rgba(227,6,19,.35)}
  50%{box-shadow:0 0 46px 6px rgba(227,6,19,.55)}}
.wl-pick{margin-top:46px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  justify-content:center;max-width:1000px}
.wl-lab{font-family:var(--en);font-size:13px;letter-spacing:4px;color:#5A5A66;margin-right:6px}
.wl-r{background:transparent;border:1px solid rgba(255,255,255,.16);color:#9A9AA6;
  border-radius:999px;padding:9px 20px;font-size:17px;cursor:pointer;font-family:var(--zh);
  transition:.15s}
.wl-r:hover{border-color:rgba(227,6,19,.6);color:#fff}
.wl-r.on{background:rgba(227,6,19,.16);border-color:var(--red);color:#fff;font-weight:700}
.wl-r .tag{font-family:var(--en);font-size:11px;letter-spacing:1px;color:#C8811A;
  border:1px solid rgba(200,129,26,.5);border-radius:5px;padding:1px 6px;margin-left:9px}
.wl-r .tag.ok{color:#3ecf6a;border-color:rgba(62,207,106,.5)}
.wl-r.empty{color:#5A5A66;border-color:rgba(255,255,255,.09)}
.wl-r.empty.on{color:#cfcfcf}
.wl-note{margin-top:18px;font-size:16px;color:#5A5A66;letter-spacing:1px}
/* ================= 考勤薪資家族（暗色，姬姐場）================= */
.wz{width:376px;background:#0a0a0c;border:1px solid rgba(255,255,255,.10);border-radius:12px;
  overflow:hidden;box-shadow:0 22px 50px rgba(0,0,0,.4);font-family:var(--zh);color:#fff;
  transform-origin:center center}
.wz.w2{width:700px}
.wz-fn{display:flex;align-items:center;gap:9px;padding:7px 11px;
  background:linear-gradient(90deg,#141418,#1c1c22);border-bottom:1px solid rgba(227,6,19,.4)}
.wz-hb{width:26px;height:23px;border:1px solid rgba(255,255,255,.25);border-radius:5px;
  display:flex;flex-direction:column;justify-content:center;align-items:center;gap:3px}
.wz-hb i{display:block;width:13px;height:2px;background:#fff}
.wz-hb i:nth-child(2){background:#E30613}
.wz-pg{font-family:var(--en);font-weight:700;font-size:9px;letter-spacing:3px;color:#E30613}
.wz-clk{margin-left:auto;font-family:var(--en);font-weight:600;font-size:11px;letter-spacing:2px}
.wz-bd{padding:11px}
.wz-tabs{display:flex;gap:5px;margin-bottom:10px}
.wz-tab{flex:1;padding:8px 0;text-align:center;font-size:11px;font-weight:700;color:#8a8a92;
  background:#15151a;border:1px solid rgba(255,255,255,.08);border-radius:7px}
.wz-tab.on{background:linear-gradient(135deg,#E30613,#8f0009);color:#fff;border-color:transparent;
  box-shadow:0 0 12px rgba(227,6,19,.4)}
.wz-tab em{font-style:normal;background:#fff;color:#E30613;border-radius:9px;font-size:9px;
  padding:0 5px;margin-left:3px;font-family:var(--en)}
.wz-card{position:relative;background:#15151a;border:1px solid rgba(255,255,255,.08);
  border-radius:9px;padding:12px;margin-bottom:10px}
.wz-card::before,.wz-card::after{content:'';position:absolute;width:10px;height:10px;
  border:2px solid #E30613}
.wz-card::before{top:-2px;left:-2px;border-right:none;border-bottom:none}
.wz-card::after{bottom:-2px;right:-2px;border-left:none;border-top:none}
.wz-lb{display:block;font-family:var(--en);font-size:9px;letter-spacing:1px;color:#8a8a92;
  margin:8px 0 3px}
.wz-in{padding:8px 9px;font-size:12px;color:#fff;background:#0e0e12;
  border:1px solid rgba(255,255,255,.18);border-radius:7px}
.wz-in.sel::after{content:'▾';float:right;color:#8a8a92}
.wz-in.ph{color:#55555e}
.wz-row{display:flex;gap:7px}.wz-row>*{flex:1}
.wz-btn{position:relative;margin:11px auto 2px;width:96%;transform:skewX(-18deg);border-radius:5px;
  background:linear-gradient(135deg,#E30613,#8f0009);
  box-shadow:0 0 14px rgba(227,6,19,.4),0 3px 0 rgba(0,0,0,.5)}
.wz-btn.gray{background:linear-gradient(135deg,#34343c,#17171b);
  border:1px solid rgba(255,255,255,.15);box-shadow:0 3px 0 rgba(0,0,0,.5)}
.wz-btn b{display:block;transform:skewX(18deg);color:#fff;font-size:13px;font-weight:700;
  letter-spacing:5px;padding:9px 0;text-align:center}
.wz-prev{text-align:center;font-size:11px;color:#8a8a92;margin:10px 0;padding:8px;
  background:#0e0e12;border:1px dashed rgba(227,6,19,.4);border-radius:7px}
.wz-prev b{color:#E30613;font-size:18px;font-family:var(--en)}
.wz-warn{font-size:10px;color:#8a8a92;background:#0e0e12;border:1px dashed rgba(227,6,19,.4);
  border-radius:7px;padding:8px 9px;margin-top:9px;line-height:1.7}
.wz-warn b{color:#E30613}
.wz-num{display:flex;justify-content:space-between;align-items:baseline}
.wz-num .n{font-family:var(--en);font-weight:700;font-size:23px;color:#E30613;
  text-shadow:0 0 12px rgba(227,6,19,.5)}
.wz-num .n.w{color:#fff;text-shadow:none}
.wz-num .l{font-size:10px;color:#8a8a92}
.wz-note{font-size:10px;color:#8a8a92;margin-top:5px}

/* 我的出勤 */
.at-m{display:flex;align-items:center;gap:8px;margin-bottom:11px}
.at-m .b{width:30px;height:30px;background:#15151a;border:1px solid rgba(255,255,255,.08);
  border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px}
.at-m .t{flex:1;text-align:center;font-family:var(--en);font-size:17px;font-weight:700;letter-spacing:2px}
.at-st{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px}
.at-st div{background:#15151a;border:1px solid rgba(255,255,255,.08);border-radius:9px;
  padding:9px 4px;text-align:center}
.at-st .n{font-family:var(--en);font-size:19px;font-weight:800;line-height:1}
.at-st .l{font-size:9px;color:#8a8a92;margin-top:4px}
.at-st .bad .n{color:#E30613}
.at-d{background:#15151a;border:1px solid rgba(255,255,255,.08);border-left:3px solid #4a4a52;
  border-radius:9px;padding:9px 11px;margin-bottom:6px}
.at-d.ok{border-left-color:#3fd06a}.at-d.warn{border-left-color:#ffb340}
.at-d.bad{border-left-color:#E30613}.at-d.leave{border-left-color:#3b82f6}
.at-d.rest{opacity:.45}
.at-top{display:flex;align-items:center;gap:8px}
.at-dt{font-family:var(--en);font-size:13px;font-weight:700}
.at-dw{font-size:10px;color:#8a8a92}
.at-tag{font-size:9px;padding:1px 7px;border-radius:4px;background:#2a2a32;color:#8a8a92}
.at-tm{margin-left:auto;font-family:var(--en);font-size:12px;font-weight:600}
.at-tm i{font-style:normal;color:#E30613}
.at-bg{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.at-b{font-size:9px;font-weight:700;padding:2px 8px;border-radius:4px}
.at-b.w{background:rgba(255,179,64,.15);color:#ffb340}
.at-b.r{background:rgba(227,6,19,.15);color:#ff6168}
.at-b.l{background:rgba(59,130,246,.15);color:#60a5fa}
.at-b.o{background:rgba(139,92,246,.15);color:#a78bfa}
.at-fix{margin-top:8px;width:100%;padding:7px;background:#E30613;color:#fff;border-radius:7px;
  font-size:11px;font-weight:700;text-align:center}

/* 忘打卡 */
.px-ty{display:flex;gap:7px;margin-top:3px}
.px-ty div{flex:1;padding:9px 0;text-align:center;font-size:12px;font-weight:700;color:#8a8a92;
  background:#0e0e12;border:1px solid rgba(255,255,255,.18);border-radius:7px}
.px-ty div.on{background:linear-gradient(135deg,#E30613,#8f0009);color:#fff;border-color:transparent;
  box-shadow:0 0 10px rgba(227,6,19,.4)}

/* 補休 */
.ct-c{background:#15151a;border:1px solid rgba(255,255,255,.08);border-left:3px solid #3a3a42;
  border-radius:8px;padding:10px 12px;margin-bottom:8px}
.ct-c.ok{border-left-color:#2e9e44}.ct-c.soon{border-left-color:#ffb340}
.ct-t{display:flex;align-items:center;gap:7px}
.ct-no{font-family:var(--en);font-size:10px;color:#8a8a92;letter-spacing:1px}
.ct-tp{font-size:9px;padding:1px 6px;border-radius:4px;background:#26262c;color:#8a8a92}
.ct-lf{margin-left:auto;font-family:var(--en);font-size:17px;font-weight:700;color:#4fd06a}
.ct-b{font-size:11px;color:#8a8a92;margin-top:5px;line-height:1.7}
.ct-b b{color:#fff;font-family:var(--en)}
.ct-e{font-size:10px;margin-top:5px;font-family:var(--en);letter-spacing:1px;color:#8a8a92}
.ct-e.soon{color:#ffb340;font-weight:700}

/* 加班 */
.ot-bar{height:10px;background:#0e0e12;border:1px solid rgba(255,255,255,.08);border-radius:5px;
  overflow:hidden;margin:9px 0 5px;position:relative}
.ot-bar .f{height:100%;background:linear-gradient(90deg,#8f0009,#E30613);
  box-shadow:0 0 8px rgba(227,6,19,.6)}
.ot-bar .w40{position:absolute;top:0;bottom:0;left:86.9%;width:2px;background:rgba(255,255,255,.45)}
.ot-cap{font-family:var(--en);font-size:11px;color:#8a8a92}

/* 我的薪資單 */
.ps-lock{border-color:rgba(255,179,0,.5)!important}
.ps-lock .t{font-size:12px;font-weight:700;color:#ffb300;margin-bottom:5px}
.ps-lock .s{font-size:11px;color:#8a8a92;line-height:1.8}
.ps-lock .s b{color:#fff}
.ps-h{display:flex;justify-content:space-between;align-items:baseline}
.ps-ym{font-family:var(--en);font-weight:700;font-size:16px;letter-spacing:2px}
.ps-net{font-family:var(--en);font-weight:700;font-size:19px;color:#E30613;
  text-shadow:0 0 10px rgba(227,6,19,.5)}
.ps-net small{font-size:10px;color:#8a8a92;font-weight:400}
.ps-d{margin-top:10px;border-top:1px dashed rgba(255,255,255,.08);padding-top:9px}
.ps-btn{width:100%;padding:8px;margin-bottom:8px;background:linear-gradient(135deg,#34343c,#17171b);
  border:1px solid rgba(227,6,19,.5);border-radius:7px;color:#fff;font-size:11px;font-weight:700;
  text-align:center}
.ps-btn.g{border-color:rgba(63,208,106,.5)}
.ps-r{display:flex;justify-content:space-between;font-size:11px;padding:3px 0}
.ps-r .k{color:#8a8a92}
.ps-r .v{color:#fff;font-family:var(--en)}
.ps-r.add .v{color:#4fd06a}
.ps-r.sub .v{color:#E30613}
.ps-r.fx{border-top:1px solid rgba(255,255,255,.08);border-bottom:1px solid rgba(255,255,255,.08);
  margin:5px 0;padding:6px 0;background:rgba(255,255,255,.03)}
.ps-r.fx .k{color:#fff;font-weight:700}
.ps-r.fx .v{color:#4fd06a;font-weight:700;font-size:13px}
.ps-r.tot{border-top:1px solid rgba(255,255,255,.08);margin-top:5px;padding-top:7px}
.ps-r.tot .k{color:#fff;font-weight:700}
.ps-r.tot .v{font-size:15px;font-weight:700;color:#E30613}
.ps-pen{margin-top:9px;padding:9px 10px;background:rgba(63,208,106,.1);
  border:1px solid rgba(63,208,106,.4);border-radius:7px;font-size:11px;color:#4fd06a;line-height:1.6}
.ps-pen b{font-family:var(--en)}
.ps-pen span{color:#8a8a92;font-size:10px}

/* ---------- 佈告欄 ---------- */
.bd-tabs{display:flex;background:#fff;border-bottom:1px solid #e8e4e4}
.bd-tab{flex:1;padding:11px 0;text-align:center;font-size:13px;font-weight:700;color:#a5a0a0;position:relative}
.bd-tab.on{color:#1A1A1A}
.bd-tab.on::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:3px;background:#E30613}
.bd-chips{display:flex;align-items:center;gap:7px;padding:10px 14px;background:rgba(255,255,255,.6);
  border-bottom:1px solid #e8e4e4}
.bd-chip{transform:skewX(-18deg);border:1.5px solid #d9d2d2;background:#fff;border-radius:8px}
.bd-chip>span{display:block;transform:skewX(18deg);padding:6px 14px;font-size:11px;font-weight:700;
  color:#6b6b6b;white-space:nowrap}
.bd-chip.on{border-color:#E30613;background:linear-gradient(135deg,#E30613,#b30510);
  box-shadow:0 3px 12px rgba(227,6,19,.35)}
.bd-chip.on>span{color:#fff}
.bd-card{background:#fff;border:1px solid #e8e4e4;border-left:4px solid #E30613;border-radius:12px;
  padding:13px 15px;margin:11px 14px}
.bd-card.c2{border-left-color:#3b82f6}
.bd-top{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.bd-badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:11px;background:#fdeeee;color:#c00}

/* ---------- 穎利 OTP 桌面程式（480x640 視窗）---------- */
.otp{position:relative;width:480px;height:640px;background:#1A1A1A;color:#fff;
  border-radius:10px;overflow:hidden;font-family:Arial,var(--zh),sans-serif;
  box-shadow:0 22px 50px rgba(0,0,0,.4);border:1px solid #2a2a2a;
  transform:scale(.78);transform-origin:center center}
.otp .o-top{display:flex;align-items:center;justify-content:space-between;
  padding:10px 16px;background:#111;border-bottom:1px solid #2a2a2a}
.otp .o-l{display:flex;align-items:center;gap:8px}
.otp .o-dot{width:18px;height:18px;background:#E30613;border-radius:50%;flex:none}
.otp .o-ttl{font-size:14px;color:#fff}
.otp .o-r{display:flex;gap:8px;align-items:center;position:relative}
.otp .o-bo{background:transparent;border:1px solid #444;color:#ccc;padding:5px 12px;
  border-radius:6px;font-size:13px}
.otp .o-br{background:#E30613;color:#fff;padding:5px 14px;border-radius:6px;font-size:13px}
.otp .o-dd{position:absolute;top:34px;right:0;background:#222;border:1px solid #333;
  border-radius:8px;overflow:hidden;min-width:150px;z-index:5}
.otp .o-di{padding:10px 16px;font-size:13px;color:#ccc;display:flex;align-items:center;gap:8px}
.otp .o-di.hot{background:#2a2a2a;color:#fff}
.otp .o-search{padding:10px 16px;border-bottom:1px solid #2a2a2a}
.otp .o-search div{background:#2a2a2a;border:1px solid #3a3a3a;border-radius:6px;
  color:#555;font-size:13px;padding:7px 12px}
.otp .o-body{padding:16px;display:flex;flex-direction:column;gap:10px}
/* 空狀態 */
.otp .o-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;height:420px;color:#555}
.otp .o-empty .ic{font-size:46px;color:#333}
.otp .o-empty .t{font-size:20px;color:#E30613}
.otp .o-empty .s{font-size:13px;color:#555}
.otp .o-empty .b{background:#E30613;color:#fff;padding:9px 24px;border-radius:6px;
  font-size:13px;margin-top:4px}
/* 卡片 */
.otp .o-card{background:#222;border:1px solid #2e2e2e;border-radius:8px;padding:14px 16px;
  display:flex;align-items:center;gap:14px}
.otp .o-card.hot{border-color:#E30613;background:#2a2020}
.otp .o-ic{width:38px;height:38px;border-radius:50%;background:#E30613;display:flex;
  align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff;flex:none}
.otp .o-info{flex:1;min-width:0}
.otp .o-nm{font-size:13px;color:#aaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.otp .o-code{font-size:26px;letter-spacing:4px;color:#fff;font-variant-numeric:tabular-nums}
.otp .o-ring{position:relative;width:32px;height:32px;flex:none}
.otp .o-ring svg{transform:rotate(-90deg)}
.otp .o-sec{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:11px;color:#aaa}
.otp .o-act{color:#555;font-size:15px}
/* 吐司 */
.otp .o-toast{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);
  background:#E30613;color:#fff;padding:8px 18px;border-radius:6px;font-size:13px;
  opacity:0;transition:opacity .3s}
.otp.copied .o-toast{opacity:1}
/* 框選掃描示意 */
.otp .o-shot{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;
  transition:opacity .3s;display:flex;align-items:center;justify-content:center}
.otp.shot .o-shot{opacity:1}
.otp .o-sel{position:relative;width:190px;height:190px;border:2px solid #E30613;
  background:rgba(255,255,255,.08)}
.otp .o-sel .qr{position:absolute;inset:16px;background:
  repeating-linear-gradient(0deg,#fff 0 7px,#1A1A1A 7px 14px),
  repeating-linear-gradient(90deg,#fff 0 7px,transparent 7px 14px);
  background-blend-mode:multiply;opacity:.85}
.otp .o-sel .ok{position:absolute;left:50%;bottom:-38px;transform:translateX(-50%);
  background:#E30613;color:#fff;padding:8px 20px;border-radius:6px;font-size:13px;
  white-space:nowrap}
.otp .o-hint{position:absolute;top:18px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.8);border:1px solid #E30613;color:#fff;padding:9px 18px;
  border-radius:8px;font-size:13px;white-space:nowrap}

/* ---------- 金鑰派發開機畫面 ---------- */
.kr{position:relative;width:640px;height:430px;background:#0a0a0c;overflow:hidden;
  border-radius:10px;box-shadow:0 22px 50px rgba(0,0,0,.35);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:var(--zh);transform:scale(1.16);transform-origin:center center}
.kr .kr-grid{position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
  background-size:36px 36px;
  -webkit-mask-image:radial-gradient(ellipse 75% 65% at 50% 50%,#000 25%,transparent 82%);
          mask-image:radial-gradient(ellipse 75% 65% at 50% 50%,#000 25%,transparent 82%)}
.kr .kr-glow{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 50% 42%,rgba(227,6,19,.12),transparent 46%)}
.kr .kr-gauge{position:relative;width:196px;height:196px;display:flex;
  align-items:center;justify-content:center;margin-bottom:20px}
.kr .kr-gauge>svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.kr .kr-bg{fill:none;stroke:rgba(255,255,255,.07);stroke-width:2}
.kr .kr-fg{fill:none;stroke:url(#krg);stroke-width:4;stroke-linecap:round;
  filter:drop-shadow(0 0 6px rgba(227,6,19,.6))}
.kr .kr-tick{fill:none;stroke:rgba(255,255,255,.11);stroke-width:1}
.kr .kr-cnrs{position:absolute;inset:-6px;pointer-events:none}
.kr .kr-cnrs i{position:absolute;width:20px;height:20px;border:2px solid rgba(227,6,19,.65)}
.kr .kr-cnrs i:nth-child(1){top:0;left:0;border-right:none;border-bottom:none}
.kr .kr-cnrs i:nth-child(2){top:0;right:0;border-left:none;border-bottom:none}
.kr .kr-cnrs i:nth-child(3){bottom:0;left:0;border-right:none;border-top:none}
.kr .kr-cnrs i:nth-child(4){bottom:0;right:0;border-left:none;border-top:none}
.kr .kr-core{position:relative;z-index:2;text-align:center}
.kr .kr-logo{width:46px;margin-bottom:7px;filter:drop-shadow(0 0 10px rgba(227,6,19,.5))}
.kr .kr-pct{font-family:var(--en);font-weight:700;font-size:44px;line-height:1;color:#fff}
.kr .kr-pct small{font-size:.42em;color:#8a8a92;margin-left:2px;vertical-align:top}
.kr .kr-cnt{font-family:var(--en);font-size:12px;letter-spacing:3px;color:#ff5560;
  margin-top:5px;font-weight:600}
.kr .kr-lab{font-family:var(--en);font-size:10px;letter-spacing:4px;color:#44444c;
  text-transform:uppercase;margin-bottom:8px}
.kr .kr-now{font-size:16px;color:#f2f2f4;letter-spacing:1px}
.kr .kr-now b{color:#3ecf6a;font-weight:700}
.kr .kr-now .cur{display:inline-block;width:2px;height:1em;background:#E30613;
  vertical-align:-2px;margin-left:3px}
.kr .kr-feed{margin-top:12px;font-family:var(--en);font-size:12px;letter-spacing:2px;color:#8a8a92}
.kr .kr-feed b{color:#3ecf6a;font-weight:700}
/* iOS 提示條 */
.kr .kr-ios{position:absolute;left:0;right:0;bottom:0;padding:11px 18px;
  background:rgba(227,6,19,.14);border-top:1px solid rgba(227,6,19,.4);
  font-size:13px;color:#ffb0b6;display:flex;align-items:center;gap:8px;
  opacity:0;transition:opacity .35s}
.kr.ios .kr-ios{opacity:1}
.kr .kr-ios i{font-style:normal;font-size:15px}

/* ---------- 系統自己的封面（打卡 / 作業中心 的迎賓畫面）---------- */
.sys{position:relative;width:640px;height:430px;background:#0a0a0c;overflow:hidden;
  transform-origin:center center;font-family:var(--zh);text-align:center;
  display:flex;flex-direction:column;align-items:center;justify-content:center}
.sys .sy-grid{position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);
  background-size:34px 34px;
  -webkit-mask-image:radial-gradient(ellipse 90% 80% at 50% 45%,#000 30%,transparent 75%);
          mask-image:radial-gradient(ellipse 90% 80% at 50% 45%,#000 30%,transparent 75%)}
.sys .sy-slash{position:absolute;left:50%;top:50%;width:200%;height:2px;pointer-events:none;
  transform:translate(-50%,-50%) rotate(-18deg);
  background:linear-gradient(90deg,transparent,#E30613,transparent);opacity:.55}
.sys .sy-cnr{position:absolute;width:16px;height:16px;border:2px solid #E30613;opacity:.8}
.sys .sy-cnr.tl{top:9px;left:9px;border-right:none;border-bottom:none}
.sys .sy-cnr.tr{top:9px;right:9px;border-left:none;border-bottom:none}
.sys .sy-cnr.bl{bottom:9px;left:9px;border-right:none;border-top:none}
.sys .sy-cnr.br{bottom:9px;right:9px;border-left:none;border-top:none}
.sys .sy-hud{position:absolute;font-family:var(--en);font-size:8px;letter-spacing:2px;
  color:#6a6a72;text-transform:uppercase}
.sys .sy-hud b{color:#E30613;font-weight:700}
.sys .sy-hud.tl{top:15px;left:18px}   .sys .sy-hud.tr{top:15px;right:18px}
.sys .sy-hud.bl{bottom:15px;left:18px}.sys .sy-hud.br{bottom:15px;right:18px}
.sys .sy-body{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center}
.sys .sy-logo{height:40px;margin-bottom:12px;filter:drop-shadow(0 0 12px rgba(227,6,19,.5))}
.sys .sy-brand{font-family:var(--en);font-weight:600;font-size:9px;letter-spacing:6px;
  color:#6a6a72;text-transform:uppercase}
.sys .sy-brand b{color:#E30613}
.sys .sy-t{margin:9px 0 3px;font-weight:900;font-size:58px;letter-spacing:9px;
  margin-right:-9px;line-height:1.1;color:#fff}
.sys .sy-s{font-family:var(--en);font-weight:700;font-size:10px;letter-spacing:6px;
  text-transform:uppercase}
.sys .sy-div{width:150px;height:3px;margin:20px 0 14px;
  background:repeating-linear-gradient(-45deg,#E30613 0 6px,transparent 6px 12px)}
.sys .sy-log{font-family:var(--en);font-size:8px;letter-spacing:2px;color:#6a6a72;
  text-align:left;text-transform:uppercase;line-height:1.85}
.sys .sy-log .ok{color:#E30613;font-weight:700}
.sys .sy-co{font-size:10px;letter-spacing:3px;color:#6a6a72;margin-bottom:4px}
.sys .sy-btn{margin-top:18px;position:relative;transform:skewX(-14deg);
  background:linear-gradient(135deg,#E30613,#8f0009);
  box-shadow:0 0 18px rgba(227,6,19,.45),0 5px 0 rgba(0,0,0,.5)}
.sys .sy-btn::before{content:'';position:absolute;inset:2px;border:1px solid rgba(255,255,255,.35)}
.sys .sy-btn .lab{display:block;transform:skewX(14deg);padding:12px 42px;
  font-weight:900;font-size:16px;letter-spacing:6px;margin-right:-6px;color:#fff}
.sys .sy-btn .en{display:block;transform:skewX(14deg);font-family:var(--en);font-weight:600;
  font-size:8px;letter-spacing:4px;color:rgba(255,255,255,.7);padding-bottom:9px;margin-top:-7px}
.sys .sy-tap{margin-top:13px;font-family:var(--en);font-size:8px;letter-spacing:4px;
  color:#6a6a72;text-transform:uppercase}
/* 打卡：金色標題 */
.sys-punch .sy-t{background:linear-gradient(180deg,#ffe27a 0%,#ffb838 45%,#ff8c1a 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  color:transparent}
.sys-punch .sy-s{color:#ffb838}
/* 作業中心：粉紅肉球 */
.sys-hub .sy-s{color:#E30613}
.sys .sy-paw{display:inline-block;width:26px;height:26px;vertical-align:middle;margin-left:4px}
.sys .sy-paw svg{width:100%;height:100%;display:block;fill:#ffb3c6}
.sys .sy-trail{position:absolute;left:50%;top:50%;width:190%;height:44px;pointer-events:none;
  transform:translate(-50%,-50%) rotate(-18deg);display:flex;justify-content:space-between;
  align-items:center;z-index:1}
.sys .sy-trail span{width:17px;height:17px;opacity:.75;
  filter:drop-shadow(0 0 6px rgba(255,179,198,.5))}
.sys .sy-trail span svg{width:100%;height:100%;display:block;fill:#ffb3c6}
.sys .sy-trail span:nth-child(odd){transform:translateY(-5px) rotate(-12deg)}
.sys .sy-trail span:nth-child(even){transform:translateY(5px) rotate(12deg)}

/* ---------- 選角迎賓頁（X4 風）---------- */
.cs{position:relative;z-index:2;width:1600px;height:900px;display:flex;
  flex-direction:column;align-items:center;justify-content:center;padding:0 70px}
.cs-hd{text-align:center;margin-bottom:30px}
.cs-logo{height:56px;filter:drop-shadow(0 0 22px rgba(227,6,19,.35));margin-bottom:12px}
.cs-eb{font-family:var(--en);font-weight:700;font-size:14px;letter-spacing:8px;color:var(--red)}
.cs-t{font-size:44px;font-weight:900;color:#fff;letter-spacing:3px;margin-top:6px}
.cs-s{font-family:var(--en);font-size:13px;letter-spacing:6px;color:#5A5A66;margin-top:9px}

.cs-stage{display:flex;align-items:stretch;gap:0;width:100%;max-width:1300px;height:452px}
.cs-mid{flex:0 0 46px;position:relative}
.cs-mid::before{content:'';position:absolute;left:50%;top:-14px;bottom:-14px;width:3px;
  transform:translateX(-50%) skewX(-9deg);
  background:linear-gradient(180deg,transparent,var(--red),transparent);
  box-shadow:0 0 18px rgba(227,6,19,.7)}
.cs-mid i{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) skewX(-9deg);
  font-family:var(--en);font-style:normal;font-weight:700;font-size:12px;letter-spacing:3px;
  color:#5A5A66;background:var(--dark);padding:9px 3px;writing-mode:vertical-rl}

.cs-p{position:relative;flex:1;min-width:0;cursor:pointer;padding:0;overflow:hidden;
  background:#0F0F14;border:2px solid rgba(255,255,255,.10);border-radius:4px;
  transform:skewX(-9deg);font-family:var(--zh);
  transition:border-color .18s,box-shadow .18s,transform .18s,background .18s}
.cs-p>*{transform:skewX(9deg)}
.cs-p .cs-in{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-end;padding:22px 30px 24px}
.cs-ph{position:absolute;inset:0;overflow:hidden}
.cs-ph img{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%) scale(1);
  height:118%;max-width:none;object-fit:contain;
  filter:grayscale(.85) brightness(.5) contrast(1.1);
  transition:filter .22s,transform .3s cubic-bezier(.2,.8,.3,1)}
.cs-ph .sys{position:absolute;left:50%;top:44%;
  transform:translate(-50%,-50%) scale(1.02);
  filter:grayscale(.85) brightness(.55) contrast(1.05);
  transition:filter .22s,transform .3s cubic-bezier(.2,.8,.3,1)}
.cs-p:hover .cs-ph .sys,.cs-p.on .cs-ph .sys{filter:none;
  transform:translate(-50%,-50%) scale(1.05)}
.cs-face{width:64px;height:64px;border-radius:50%;object-fit:cover;object-position:center 10%;
  border:2px solid rgba(227,6,19,.75);margin-right:2px}
.cs-ds{position:relative;z-index:2}
.cs-ph::after{content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(10,10,14,.35) 0%,rgba(10,10,14,.1) 38%,
             rgba(10,10,14,.88) 74%,rgba(10,10,14,.98) 100%)}
.cs-ph.miss{background:radial-gradient(ellipse 70% 60% at 50% 38%,rgba(227,6,19,.16),transparent 70%)}
.cs-miss{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);
  font-size:250px;font-weight:900;line-height:1;color:transparent;
  -webkit-text-stroke:2px rgba(255,255,255,.13);user-select:none}
.cs-scan{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .2s;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.055) 0 1px,transparent 1px 4px)}
.cs-cnr{position:absolute;width:26px;height:26px;border:3px solid var(--red);
  opacity:0;transition:opacity .2s}
.cs-cnr.tl{top:9px;left:9px;border-right:none;border-bottom:none}
.cs-cnr.tr{top:9px;right:9px;border-left:none;border-bottom:none}
.cs-cnr.bl{bottom:9px;left:9px;border-right:none;border-top:none}
.cs-cnr.br{bottom:9px;right:9px;border-left:none;border-top:none}

.cs-no{position:absolute;top:16px;left:22px;font-family:var(--en);font-weight:700;
  font-size:52px;line-height:1;color:rgba(255,255,255,.10);letter-spacing:-1px;transition:color .2s}
.cs-nm{font-size:46px;font-weight:900;color:#fff;letter-spacing:4px;line-height:1.1;
  text-shadow:0 3px 18px rgba(0,0,0,.85)}
.cs-en{font-family:var(--en);font-weight:700;font-size:13px;letter-spacing:6px;
  color:#8A8A96;margin-top:5px}
.cs-ds{font-size:19px;color:#B4B4BE;margin-top:12px;letter-spacing:.5px}
.cs-sp{margin-top:15px;display:inline-flex;align-items:center;gap:9px;
  padding:7px 17px;border:1px solid rgba(255,255,255,.16);border-radius:2px;
  background:rgba(0,0,0,.42);transition:border-color .2s,background .2s}
.cs-sp b{font-size:20px;font-weight:900;color:#fff;letter-spacing:2px}
.cs-sp em{font-family:var(--en);font-style:normal;font-size:11px;letter-spacing:2px;color:#8A8A96}
.cs-sp span{font-size:12px;color:#6A6A76;letter-spacing:2px}
.cs-ct{position:absolute;top:18px;right:20px;font-family:var(--en);font-size:12px;
  letter-spacing:2px;color:#6A6A76;border:1px solid rgba(255,255,255,.14);padding:4px 10px}

/* 選中 / 滑過 */
.cs-p:hover,.cs-p.on{border-color:var(--red);background:#15151b;
  box-shadow:0 0 0 1px rgba(227,6,19,.45),0 0 46px rgba(227,6,19,.34),
             inset 0 0 70px rgba(227,6,19,.10)}
.cs-p:hover .cs-ph img,.cs-p.on .cs-ph img{filter:grayscale(0) brightness(1) contrast(1);
  transform:translate(-50%,-50%) scale(1.05)}
.cs-p:hover .cs-scan,.cs-p.on .cs-scan{opacity:1}
.cs-p:hover .cs-cnr,.cs-p.on .cs-cnr{opacity:1}
.cs-p:hover .cs-no,.cs-p.on .cs-no{color:rgba(227,6,19,.55)}
.cs-p:hover .cs-sp,.cs-p.on .cs-sp{border-color:rgba(227,6,19,.75);background:rgba(227,6,19,.16)}
.cs-p.on{transform:skewX(-9deg) translateY(-7px)}
.cs-p.on::after{content:'READY';position:absolute;left:0;right:0;bottom:0;
  transform:none;font-family:var(--en);font-weight:700;font-size:12px;letter-spacing:7px;
  color:#fff;background:linear-gradient(90deg,var(--red),var(--red-d,#8f0009));padding:6px 0;
  animation:csReady 1.5s ease-in-out infinite}
@keyframes csReady{0%,100%{opacity:1}50%{opacity:.45}}
.cs-p.go{animation:csGo .34s ease-out forwards}
@keyframes csGo{0%{transform:skewX(-9deg) translateY(-7px)}
  40%{transform:skewX(-9deg) scale(1.04);box-shadow:0 0 0 4px #fff,0 0 90px rgba(255,255,255,.9)}
  100%{transform:skewX(-9deg) scale(1.16);opacity:0}}

.cs-tip{margin-top:26px;font-size:16px;color:#5A5A66;letter-spacing:1px}
.cs-tip b{color:#9A9AA6;font-weight:700;border:1px solid rgba(255,255,255,.18);
  border-radius:3px;padding:1px 8px;margin:0 3px;font-family:var(--en);font-size:13px}
.cs-more{margin-top:16px;display:flex;align-items:center;justify-content:center;
  gap:8px;flex-wrap:wrap}
.cs-more .lab{font-family:var(--en);font-size:12px;letter-spacing:4px;color:#4A4A55;margin-right:4px}
.cs-more button{background:transparent;border:1px solid rgba(255,255,255,.14);color:#7A7A86;
  font-family:var(--zh);font-size:15px;padding:6px 15px;border-radius:3px;cursor:pointer;
  transform:skewX(-9deg);transition:.16s}
.cs-more button>span{display:block;transform:skewX(9deg)}
.cs-more button:hover{border-color:rgba(227,6,19,.6);color:#fff}
.cs-more button.on{background:rgba(227,6,19,.16);border-color:var(--red);color:#fff;font-weight:700}
.cs-more .n{font-family:var(--en);font-size:11px;color:#3ecf6a;margin-left:7px;font-weight:700}
.cs-more button.dev{border-style:dashed;border-color:rgba(255,255,255,.20)}
/* 還沒建置：灰＝真的不能按（顏色語意：紅=主要 藍=次要 灰=不能按）*/
.cs-more button.lock{border-style:dashed;border-color:rgba(255,255,255,.07);
  color:#3b3b44;cursor:not-allowed;pointer-events:none}
.cs-more button.lock .lk{margin-left:6px;font-size:12px;opacity:.6}
.cs-more .sep{width:1px;height:22px;background:rgba(255,255,255,.12);margin:0 6px}
.cs-more .tag{font-family:var(--en);font-size:11px;color:#C8811A;margin-left:6px}
.wl-foot{position:absolute;bottom:44px;font-family:var(--en);font-size:14px;
  letter-spacing:4px;color:#4A4A55;z-index:2}


/* ---------- 活介面示範頁 ---------- */
.demo{display:grid;grid-template-columns:760px 1fr;gap:46px;flex:1;min-height:0;align-items:center;overflow:hidden}
.demo.d-phone{grid-template-columns:400px 1fr}
.demo .caps{display:grid;gap:calc(16px*var(--k,1));align-content:center;overflow:hidden;min-height:0;min-width:0}
/* ★ grid/flex 子項預設 min-width:auto，會撐到 max-content 不換行 → 整段被切掉。一定要歸零 */
.demo .caps>*,.cap,.cap>div,.item,.item>div{min-width:0}
.cap h3,.cap p,.item h3,.item p{overflow-wrap:break-word}
.cap{display:flex;gap:16px;align-items:flex-start;border-left:6px solid var(--line);padding:calc(6px*var(--k,1)) 0 calc(6px*var(--k,1)) 18px}
.cap .idx{font-family:var(--en);font-weight:700;font-size:19px;color:var(--red);width:32px;flex:none;padding-top:5px}
.cap h3{font-size:calc(31px*var(--k,1));font-weight:900;color:var(--ink);line-height:1.3}
.cap p{font-size:calc(24px*var(--k,1));color:var(--sub);line-height:1.55;margin-top:4px}
.cap.shown{border-left-color:var(--red)}

.phone{width:352px;justify-self:center;background:#0a0a0c;border:9px solid #26262c;border-radius:34px;
  padding:12px 12px 20px;box-shadow:0 22px 50px rgba(0,0,0,.3);position:relative;overflow:hidden}
.phone::before{content:'';position:absolute;top:12px;left:50%;transform:translateX(-50%);
  width:96px;height:6px;background:#26262c;border-radius:4px}
.pu-bar{display:flex;align-items:center;gap:8px;padding:16px 8px 8px;border-bottom:1px solid rgba(227,6,19,.35)}
.pu-bar .pg{font-family:var(--en);font-weight:700;font-size:10px;letter-spacing:3px;color:var(--red)}
.pu-bar .ck{margin-left:auto;font-family:var(--en);font-weight:600;font-size:12px;color:#fff;letter-spacing:1px}
.pu-card{background:#15151a;border:1px solid rgba(255,255,255,.08);border-radius:9px;
  padding:14px;margin:14px 4px;position:relative}
.pu-card::before,.pu-card::after{content:'';position:absolute;width:12px;height:12px;border:2px solid var(--red)}
.pu-card::before{top:-2px;left:-2px;border-right:none;border-bottom:none}
.pu-card::after{bottom:-2px;right:-2px;border-left:none;border-top:none}
.pu-date{font-family:var(--en);font-size:11px;letter-spacing:2px;color:#8a8a92}
.pu-name{font-size:18px;font-weight:700;color:#fff;margin:2px 0 11px}
.pu-row{display:flex;gap:9px}
.pu-cell{flex:1;background:#0e0e12;border:1px solid rgba(255,255,255,.08);border-radius:7px;padding:10px 4px;text-align:center}
.pu-lab{font-family:var(--en);font-size:9px;letter-spacing:1.5px;color:#8a8a92;margin-bottom:3px}
.pu-time{font-family:var(--en);font-weight:700;font-size:19px;color:#3a3a42;letter-spacing:1px}
.pu-cell.done{border-color:rgba(227,6,19,.5)}
.pu-cell.done .pu-time{color:var(--red);text-shadow:0 0 10px rgba(227,6,19,.55)}
.pu-btn{display:block;width:92%;margin:0 auto 13px;height:74px;border:none;border-radius:7px;
  transform:skewX(-18deg);position:relative;transition:.35s}
.pu-btn::before{content:'';position:absolute;inset:4px;border:1px solid rgba(255,255,255,.28);border-radius:4px}
.pu-btn .in2{transform:skewX(18deg);display:flex;flex-direction:column;align-items:center;
  justify-content:center;height:100%;gap:2px}
.pu-btn .zh{color:#fff;font-size:19px;font-weight:700;letter-spacing:5px;margin-right:-5px}
.pu-btn .en2{font-family:var(--en);font-weight:600;font-size:9px;letter-spacing:3px;color:rgba(255,255,255,.6)}
.pu-btn.i{background:linear-gradient(135deg,#E30613,#8f0009);box-shadow:0 0 18px rgba(227,6,19,.4),0 5px 0 rgba(0,0,0,.5)}
.pu-btn.o{background:linear-gradient(135deg,#2b4d6f,#16293c);border:1px solid rgba(120,190,255,.32);
  box-shadow:0 0 14px rgba(60,130,200,.3),0 5px 0 rgba(0,0,0,.5)}
.pu-btn.off{opacity:.3;filter:grayscale(1);box-shadow:none}
.pu-btn.off .zh{letter-spacing:2px;margin-right:-2px;font-size:17px}
.pu-btn.off .en2{letter-spacing:1px;font-size:11px;text-transform:none}
.pu-hint{text-align:center;font-size:11px;color:#ffb340;margin:-4px 0 8px;min-height:15px}

/* ---------- 請款單活介面（淺色，跟真實頁面一致）---------- */
.pf{width:100%;background:#F4F4F4;border-radius:14px;overflow:hidden;
  box-shadow:0 18px 44px rgba(0,0,0,.16);position:relative}
.pf-nav{background:#1A1A1A;color:rgba(255,255,255,.55);font-size:12px;
  padding:9px 14px;display:flex;align-items:center;gap:8px}
.pf-nav .num{width:17px;height:17px;border-radius:50%;background:var(--red);color:#fff;
  font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.pf-nav .ar{color:rgba(255,255,255,.3)}
.pf-nav .q{margin-left:auto;color:#fff;font-weight:700;background:rgba(227,6,19,.22);
  border:1px solid rgba(227,6,19,.5);padding:4px 11px;border-radius:20px;font-size:11px}
.pf-card{background:#fff;margin:14px;border-radius:10px;overflow:hidden;
  box-shadow:0 2px 10px rgba(0,0,0,.06)}
.pf-hd{background:#1A1A1A;color:#fff;padding:10px 15px;font-weight:700;font-size:13px}
.pf-hd i{color:var(--red);font-style:normal;margin-right:7px}
.pf-bd{padding:16px}
.pf-g{margin-bottom:13px}
.pf-l{font-size:12px;font-weight:700;color:#444;margin-bottom:5px}
.pf-l em{color:var(--red);font-style:normal}
.pf-i{border:1.5px solid #e0e0e0;border-radius:7px;padding:9px 12px;font-size:13px;
  color:#1A1A1A;background:#fff}
.pf-i.ph{color:#aaa}
.pf-i.sel::after{content:'▾';float:right;color:#888}
.pf-i.ro{background:#f7f7f7;font-weight:700}
.pf-i.ro em{color:var(--red);font-style:normal;margin-right:7px}
.pf-row{display:flex;gap:11px}.pf-row>*{flex:1}
.pf-co{display:flex;gap:10px}
.pf-co div{flex:1;border:2px solid #e0e0e0;border-radius:9px;padding:10px;text-align:center;
  font-size:12px;color:#888;background:#fff}
.pf-co div.on{border-color:var(--red);background:#fff5f5;color:#1A1A1A;font-weight:700}
.pf-dd{border:1.5px solid var(--red);border-top:none;border-radius:0 0 7px 7px;background:#fff;
  box-shadow:0 4px 12px rgba(0,0,0,.1)}
.pf-dd div{padding:8px 12px;font-size:13px;color:#333}
.pf-dd div.add{color:var(--red);font-weight:700;border-top:1px solid #eee}
.pf-go{background:var(--red);color:#fff;text-align:center;padding:12px;border-radius:8px;
  font-size:15px;font-weight:700;letter-spacing:2px}
/* 查詢頁 */
.pl-chips{display:flex;gap:7px;padding:12px 14px 0}
.pl-chip{background:#fff;border:1.5px solid #e0e0e0;border-radius:20px;padding:6px 14px;
  font-size:12px;font-weight:600;color:#666}
.pl-chip.on{background:var(--red);border-color:var(--red);color:#fff}
.pl-scope{margin-left:auto;font-size:11px;color:#888;align-self:center}
.pl-c{background:#fff;border-radius:10px;margin:12px 14px;box-shadow:0 2px 10px rgba(0,0,0,.06);
  border-left:4px solid #e0e0e0;overflow:hidden}

/* ---------- 訂會議室活介面 ---------- */
.bk{width:100%;background:#111116;border:1px solid rgba(227,6,19,.3);border-radius:12px;
  padding:20px;box-shadow:0 18px 44px rgba(0,0,0,.3);position:relative;overflow:hidden}
.bk .part,.pf .part{transition:opacity .35s,filter .35s}
.pf.focusing .part{opacity:.24;filter:saturate(.25)}
.pf.focusing .part.hit{opacity:1;filter:none;position:relative;z-index:2}
.pf.focusing .part.hit::after{content:'';position:absolute;inset:-7px;border:2px solid var(--red);
  border-radius:9px;box-shadow:0 0 18px rgba(227,6,19,.5);pointer-events:none}
/* ★ 滿版區塊（pf-nav / rl-search / rl-badges）左右沒有留白，
   紅框畫在 -7px 會被 .pf 的 overflow:hidden 切成兩條橫線 → 改成往內畫 */
.pf.focusing .part.hit.fw::after{inset:-3px 9px}
/* 考勤家族聚焦（沿用同一套 part/hit）*/
.wz .part{transition:opacity .35s,filter .35s}
.wz.focusing .part{opacity:.24;filter:saturate(.25)}
.wz.focusing .part.hit{opacity:1;filter:none;position:relative;z-index:2}
.wz.focusing .part.hit::after{content:'';position:absolute;inset:-6px;border:2px solid var(--red);
  border-radius:8px;box-shadow:0 0 18px rgba(227,6,19,.5);pointer-events:none}
.bk .part{transition:opacity .35s,filter .35s}
.bk.focusing .part{opacity:.26;filter:saturate(.3)}
.bk.focusing .part.hit{opacity:1;filter:none;position:relative;z-index:2}
.bk.focusing .part.hit::after{content:'';position:absolute;inset:-8px;border:2px solid var(--red);
  border-radius:9px;box-shadow:0 0 18px rgba(227,6,19,.55);pointer-events:none}

  font-weight:700;margin-bottom:14px}

.bk-ai .lv.off{background:rgba(227,6,19,.2);color:#ff8a90}

.bk-chip.on{background:var(--red);border-color:var(--red);color:#fff}

.bk-ft{display:flex;align-items:center;gap:11px;margin-top:14px}

  font-size:14px;font-weight:700;padding:10px 22px;border-radius:8px}

/* ---------- 白底封面 ---------- */
.slide.light{padding:56px 96px 150px}
.lc-grid{display:grid;grid-template-columns:1fr 560px;gap:56px;align-items:center;
  flex:1;min-height:0;position:relative;z-index:2}
.lc-photo{position:relative;width:100%;aspect-ratio:1/1;max-height:520px;justify-self:end}
.lc-photo .plate{position:absolute;inset:14px -10px -14px 26px;transform:skewX(-18deg);
  background:linear-gradient(140deg,var(--red),#8f0009);opacity:.14}
.lc-photo .edge{position:absolute;left:-18px;top:26px;bottom:-8px;width:12px;
  background:var(--red);transform:skewX(-18deg)}
.lc-sys{display:flex;align-items:center;justify-content:center;overflow:visible}
.lc-sys .sys{transform:scale(.86);box-shadow:0 22px 46px rgba(0,0,0,.3)}
.lc-photo img{position:relative;width:100%;height:100%;object-fit:contain;
  filter:drop-shadow(0 22px 40px rgba(0,0,0,.22))}

/* ── 第一段：進頁自動跑（標題群）── */
.slide.light .anim{opacity:0}
.slide.light.play .anim{animation:lcRise .8s cubic-bezier(.2,.85,.3,1) both}
@keyframes lcRise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.slide.light.play .a1{animation-delay:.15s} .slide.light.play .a2{animation-delay:.40s}
.slide.light.play .a3{animation-delay:.62s} .slide.light.play .a4{animation-delay:1.02s}
.slide.light.play .lc-rule{animation:lcWipe .55s cubic-bezier(.2,.85,.3,1) .78s both}
@keyframes lcWipe{from{opacity:0;width:0}to{opacity:1;width:150px}}
.slide.light.play .lc-bar{animation:lcBar .7s cubic-bezier(.2,.85,.3,1) both}
@keyframes lcBar{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.lc-bar{transform-origin:top}

/* ── 第二段：按下一步才出現（人物 ＋ 名字）── */
.slide.light .lc-photo, .slide.light .lc-sp, .slide.light .lc-meta{opacity:0}
.slide.light.reveal .lc-photo{animation:lcPhoto 1.05s cubic-bezier(.2,.85,.3,1) both}
@keyframes lcPhoto{
  0%{opacity:0;clip-path:polygon(0 0,0 0,-14% 100%,0 100%);transform:translateX(46px) scale(1.05)}
  60%{opacity:1}
  100%{opacity:1;clip-path:polygon(0 0,124% 0,110% 100%,0 100%);transform:none}}
.slide.light.reveal .lc-photo::after{content:'';position:absolute;top:-4%;bottom:-4%;width:70px;
  background:linear-gradient(90deg,transparent,rgba(227,6,19,.55),transparent);
  transform:skewX(-18deg);animation:lcSweep .85s ease-out .18s both;pointer-events:none}
@keyframes lcSweep{from{left:-14%;opacity:0}20%{opacity:1}to{left:112%;opacity:0}}
.slide.light.reveal .lc-sp{animation:lcRise .7s cubic-bezier(.2,.85,.3,1) .55s both}
.slide.light.reveal .lc-meta{animation:lcRise .7s cubic-bezier(.2,.85,.3,1) .80s both}
/* 提示：還沒按下一步時，右下角輕輕呼吸 */
.slide.light .lc-cue{position:absolute;right:96px;bottom:64px;font-family:var(--en);
  font-size:15px;letter-spacing:3px;color:#B9B9C0;z-index:3;animation:lcCue 1.8s ease-in-out infinite}
.slide.light.reveal .lc-cue{display:none}
@keyframes lcCue{0%,100%{opacity:.35}50%{opacity:.9}}

.slide.light{background:#fff}
.lc-mark{position:absolute;right:-150px;top:-120px;width:760px;height:760px;
  background:linear-gradient(135deg,rgba(227,6,19,.09),rgba(227,6,19,0));
  transform:skewX(-18deg);pointer-events:none}
.lc-bar{position:absolute;left:0;top:0;bottom:0;width:16px;background:var(--red)}
.lc-wrap{margin:auto 0;max-width:1150px;position:relative;z-index:2}
.lc-logo{height:104px;width:auto;display:block;margin-bottom:34px}
.lc-eyebrow{font-family:var(--en);font-weight:700;font-size:19px;letter-spacing:7px;
  color:var(--red);text-transform:uppercase;margin-bottom:18px}
.lc-title{font-size:82px;font-weight:900;color:var(--ink);line-height:1.16;letter-spacing:-2px}
.lc-rule{width:150px;height:10px;background:var(--red);transform:skewX(-18deg);margin:30px 0 26px}
.lc-sub{font-size:29px;color:var(--sub);line-height:1.6}
.lc-foot{position:absolute;left:96px;right:96px;bottom:64px;display:flex;align-items:flex-end;
  border-top:2px solid var(--line);padding-top:22px;z-index:2}
.lc-sp{display:flex;align-items:center;gap:18px}
.lc-sp .tag{font-family:var(--en);font-size:14px;letter-spacing:4px;color:var(--sub);
  text-transform:uppercase;writing-mode:vertical-rl;text-orientation:upright;
  border-right:2px solid var(--red);padding-right:10px;line-height:1}
.lc-sp .who b{display:block;font-size:40px;font-weight:900;color:var(--ink);line-height:1.15}
.lc-sp .who i{display:block;font-family:var(--en);font-weight:700;font-size:21px;
  letter-spacing:3px;color:var(--red);font-style:normal;margin-top:4px}
.lc-meta{margin-left:auto;text-align:right;font-family:var(--en);font-size:16px;
  letter-spacing:3px;color:var(--sub);line-height:1.9}

/* ---------- 吸血鬼封面（黑紅版・家兒場）---------- */
.slide.light.vamp{background:#08080b}
.vamp .lc-mark{background:linear-gradient(135deg,rgba(227,6,19,.30),rgba(227,6,19,0))}
.vamp .lc-bar{background:linear-gradient(180deg,#ff2a38,#8f0009);
  box-shadow:0 0 26px rgba(227,6,19,.85)}
.vamp .lc-eyebrow{color:#ff2a38;text-shadow:0 0 16px rgba(227,6,19,.7)}
.vamp .lc-title{color:#fff;text-shadow:0 0 36px rgba(227,6,19,.45),0 3px 0 rgba(0,0,0,.6)}
.vamp .lc-rule{background:linear-gradient(90deg,#ff2a38,#8f0009);
  box-shadow:0 0 20px rgba(227,6,19,.75)}
.vamp .lc-sub{color:#A9A9B6}
.vamp .lc-logo{filter:drop-shadow(0 0 18px rgba(227,6,19,.55))}
.vamp .lc-foot{border-top-color:rgba(227,6,19,.35)}
.vamp .lc-sp .tag{color:#7A7A86;border-right-color:#ff2a38}
.vamp .lc-sp .who b{color:#fff}
.vamp .lc-sp .who i{color:#ff2a38}
.vamp .lc-meta{color:#7A7A86}
.vamp .lc-cue{color:#5A5A66}
.vamp .lc-photo .plate{background:linear-gradient(140deg,#E30613,#3a0004);opacity:.30}
.vamp .lc-photo .edge{background:linear-gradient(180deg,#ff2a38,#8f0009);
  box-shadow:0 0 22px rgba(227,6,19,.8)}
.vamp .lc-photo img{filter:drop-shadow(0 22px 44px rgba(0,0,0,.65))
  drop-shadow(0 0 32px rgba(227,6,19,.35))}
/* 背景三層：格線 + 血光 + 底霧 */
.vamp .vp-grid{position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:58px 58px;
  -webkit-mask-image:radial-gradient(ellipse 74% 66% at 42% 46%,#000 18%,transparent 82%);
          mask-image:radial-gradient(ellipse 74% 66% at 42% 46%,#000 18%,transparent 82%)}
.vamp .vp-glow{position:absolute;right:-8%;top:-16%;width:1040px;height:1040px;pointer-events:none;
  background:radial-gradient(circle,rgba(227,6,19,.30),rgba(227,6,19,.06) 42%,transparent 68%)}
.vamp .vp-fog{position:absolute;left:0;right:0;bottom:0;height:330px;pointer-events:none;
  background:linear-gradient(0deg,rgba(227,6,19,.15),transparent)}
/* 上緣血滴 */
.vamp .vp-drip{position:absolute;top:0;width:5px;pointer-events:none;opacity:.9;
  background:linear-gradient(180deg,#E30613,#5c0006);border-radius:0 0 4px 4px}
.vamp .vp-drip::after{content:'';position:absolute;left:50%;bottom:-9px;width:11px;height:13px;
  transform:translateX(-50%);background:#E30613;
  border-radius:50% 50% 50% 50%/62% 62% 38% 38%;
  box-shadow:0 0 12px rgba(227,6,19,.9);animation:vpDrop 3.6s ease-in infinite}
@keyframes vpDrop{0%,58%{transform:translate(-50%,0) scale(1);opacity:1}
  86%{transform:translate(-50%,92px) scale(.65);opacity:.2}
  87%,100%{transform:translate(-50%,0) scale(.35);opacity:0}}
.vamp .vp-drip.d1{left:7.5%;height:76px}
.vamp .vp-drip.d2{left:19%;height:44px}
.vamp .vp-drip.d2::after{animation-delay:1.2s}
.vamp .vp-drip.d3{left:30%;height:26px}
.vamp .vp-drip.d3::after{animation-delay:2.4s}
/* 蝙蝠 */
.vamp .vp-bat{position:absolute;pointer-events:none;opacity:.55;z-index:1;
  filter:drop-shadow(0 0 9px rgba(227,6,19,.6));animation:vpFly 7s ease-in-out infinite}

  stroke:rgba(227,6,19,.7);stroke-width:1.6}

  50%{transform:translate(-16px,-24px) rotate(6deg)}}

/* ---------- 機車燈效（疊在人物圖上，座標可調）---------- */
.vp-moto{position:absolute;inset:0;z-index:2;pointer-events:none;mix-blend-mode:screen}
.vp-moto>*{position:absolute}
/* 大燈光暈 */
.mo-head{left:var(--hx);top:var(--hy);
  width:calc(150px*var(--hs));height:calc(150px*var(--hs));
  margin:calc(-75px*var(--hs)) 0 0 calc(-75px*var(--hs));
  background:radial-gradient(circle,rgba(255,255,255,.95),rgba(255,238,195,.55) 20%,
             rgba(255,170,60,.22) 46%,transparent 72%);
  animation:moPulse 2.6s ease-in-out infinite}
/* 燈心（白熱點）*/
.mo-core{left:var(--hx);top:var(--hy);
  width:calc(26px*var(--hs));height:calc(26px*var(--hs));
  margin:calc(-13px*var(--hs)) 0 0 calc(-13px*var(--hs));
  border-radius:50%;background:#fff;filter:blur(3px);
  animation:moFlick 4.6s ease-in-out infinite}
/* 光束（三角錐）*/
.mo-beam{left:var(--hx);top:var(--hy);width:var(--bw);height:26%;
  transform-origin:0 50%;
  transform:translateY(-50%) rotate(var(--ba)) scaleX(var(--bd));
  background:linear-gradient(90deg,rgba(255,242,215,.55),rgba(255,222,165,.16) 42%,transparent 78%);
  clip-path:polygon(0 45%,100% 0,100% 100%,0 55%);
  filter:blur(7px);animation:moBeam 5s ease-in-out infinite}
/* 尾燈 */
.mo-tail{left:var(--tx);top:var(--ty);
  width:calc(84px*var(--ts));height:calc(84px*var(--ts));
  margin:calc(-42px*var(--ts)) 0 0 calc(-42px*var(--ts));
  background:radial-gradient(circle,rgba(255,72,84,.9),rgba(227,6,19,.34) 32%,transparent 70%);
  animation:moTail 2.6s ease-in-out infinite}
/* 地面反光 */
.mo-pool{left:var(--px);bottom:var(--pb);width:var(--pw);height:11%;
  transform:translateX(-50%);
  background:radial-gradient(ellipse at center,rgba(255,192,112,.30),transparent 70%);
  filter:blur(10px);animation:moPulse 2.6s ease-in-out infinite}
@keyframes moPulse{0%,100%{opacity:.85;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
@keyframes moFlick{0%,40%,47%,100%{opacity:1}43%{opacity:.4}45%{opacity:.95}74%{opacity:.75}}
@keyframes moBeam{0%,100%{opacity:.5}50%{opacity:.85}}
@keyframes moTail{0%,100%{opacity:.55}50%{opacity:1}}

var DATA = null, ROUTE = null, IDX = 0, STEP = 0, SLIDES = [];
var $ = function(id){ return document.getElementById(id); };
var esc = function(s){ return String(s == null ? '' : s); };

/* ---------- 載入 ---------- */
function boot(){
  var done = false;
  function useFallback(why){
    if (done) return; done = true;
    try { setData(FALLBACK, '內建快照（' + (why || '抓不到外部檔') + '）'); }
    catch(e){ showFatal(e); }
  }
  try {
    if (typeof fetch !== 'function') return useFallback('瀏覽器不支援 fetch');
    fetch('deck-data.json', {cache:'no-store'})
      .then(function(r){ if(!r.ok) throw 0; return r.json(); })
      .then(function(j){ if (done) return; done = true; setData(j, '外部 deck-data.json'); })
      .catch(function(){ useFallback(); });
    setTimeout(function(){ useFallback('外部檔逾時'); }, 3000);   // ★ 3 秒保底，絕不空白
  } catch(e){ useFallback('讀取失敗'); }
}

/* ★ 真的爆了就把錯誤印在畫面上，不要留一片白 */
function showFatal(e){
  var d = $('deck');
  if (d) d.innerHTML = '<div class="slide on" style="padding:80px 96px">' +
    '<div class="h1">簡報載入失敗</div>' +
    '<div class="lead">請按 F12 看 Console，或把下面這行貼給工程師。</div>' +
    '<div class="rule"></div><div style="font-size:20px;color:#8a8a92;font-family:monospace">' +
    String(e && (e.stack || e.message) || e).slice(0, 400) + '</div></div>';
}
addEventListener('error', function(ev){ if (!SLIDES.length) showFatal(ev.error || ev.message); });
function setData(j, src){
  DATA = j;
  $('src').textContent = '資料來源：' + src + ' ｜ ' + esc(j.meta && j.meta.ver);
  renderRoutes();
  // ★ 只有網址明寫 ?route=xxx 才跳過迎賓頁；否則停在迎賓頁等按 START
  var q = (location.search.match(/[?&]route=([^&]+)/) || [])[1];
  var go = q ? decodeURIComponent(q) : '';
  if (go && (j.routes || []).some(function(r){ return r.id === go; })) pick(go);
}

/* ---------- 選角音效（Web Audio，不用外部檔）---------- */
var _CSAC = null;
function _csAC(){
  try{
    if (!_CSAC) _CSAC = new (window.AudioContext || window.webkitAudioContext)();
    if (_CSAC.state === 'suspended') _CSAC.resume();
  }catch(e){ _CSAC = null; }
  return _CSAC;
}
/* 瀏覽器要有使用者互動過才准出聲 → 任何一次點擊/按鍵先把音訊解鎖 */
addEventListener('pointerdown', _csAC, {passive:true});
addEventListener('keydown', _csAC);

function csBlip(){                       /* hover：短促上掃 */
  var ac = _csAC(); if (!ac) return;
  var t = ac.currentTime;
  var o = ac.createOscillator(), g = ac.createGain();
  o.type = 'square';
  o.frequency.setValueAtTime(620, t);
  o.frequency.exponentialRampToValueAtTime(1240, t + 0.05);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.07, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.11);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + 0.12);
}
function csConfirm(){                    /* click：確定音（雙音 + 低頻推力）*/
  var ac = _csAC(); if (!ac) return;
  var t = ac.currentTime;
  [[880, 0], [1320, 0.075]].forEach(function(x){
    var o = ac.createOscillator(), g = ac.createGain(), tt = t + x[1];
    o.type = 'square'; o.frequency.setValueAtTime(x[0], tt);
    g.gain.setValueAtTime(0.0001, tt);
    g.gain.exponentialRampToValueAtTime(0.10, tt + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, tt + 0.19);
    o.connect(g); g.connect(ac.destination); o.start(tt); o.stop(tt + 0.2);
  });
  var b = ac.createOscillator(), bg = ac.createGain();
  b.type = 'sine'; b.frequency.setValueAtTime(150, t);
  b.frequency.exponentialRampToValueAtTime(52, t + 0.32);
  bg.gain.setValueAtTime(0.0001, t);
  bg.gain.exponentialRampToValueAtTime(0.16, t + 0.02);
  bg.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
  b.connect(bg); bg.connect(ac.destination); b.start(t); b.stop(t + 0.42);
}

function csNoPhoto(img, ch){
  var box = img.parentNode; if (!box) return;

/* 滑過／方向鍵移動選擇 */
function csHover(id){
  if (id === PICKED) return;
  setRoute(id); csBlip();
}
function csMove(dir){
  var mains = mainRoutes(); if (mains.length < 2) return;
  var i = mains.map(function(r){ return r.id; }).indexOf(PICKED);
  var j = (i < 0) ? 0 : (i + dir + mains.length) % mains.length;
  csHover(mains[j].id);
}
/* 確定：閃一下 + 確定音，動畫跑完才進場 */
function csGo(id){
  if (id) setRoute(id);
  csConfirm();
  var el = $('routes').querySelector('.cs-p[data-id="' + (id || PICKED) + '"]');
  if (el){ el.classList.add('go'); setTimeout(function(){ pick(id || PICKED); }, 330); }
  else pick(id || PICKED);
}

function setRoute(id){
  PICKED = id;
  $('routes').querySelectorAll('.cs-p,.cs-more button').forEach(function(b){
    b.classList.toggle('on', b.getAttribute('data-id') === id);
  });
}
function startDeck(){ csGo(PICKED); }

function pick(id){
  ROUTE = id;
  document.body.classList.toggle('devroute', id === '_dev');
  SLIDES = (DATA.slides || []).filter(function(s){
    if (id === '_dev') return true;
    if (s.always) return true;                 // 封面／結尾：每一場都要
    var r = s.roles || ['*'];
    if (id === 'hub' || id === 'all') return r.indexOf('*') > -1 || r.indexOf('hub') > -1 || r.indexOf('all') > -1;
    return r.indexOf(id) > -1;                 // ★ 部門場只放自己的，不重播綜合功能
  });
  IDX = 0; STEP = 0;
  $('routes').classList.remove('on');
  buildDeck();
  show();
}

/* ---------- 顯示 / 逐步展開 ---------- */
var MIN_K = 0.9;   // ★ 投影可讀下限；再放不下就是那頁該拆
/* 畫面元件比版面高 → 整塊等比縮小（不重排、不變形） */
function fitVisual(sl){
  var demo = sl.querySelector('.demo'); if (!demo) return;
  var vis = demo.querySelector('.pf, .bk, .hub, .phone, .shot, .kr, .otp, .wz'); if (!vis) return;
  vis.style.transform = '';
  // ★ 兩個都要用版面尺標（offsetHeight），不能用 getBoundingClientRect —— 舞台本身有 scale
  var H = demo.clientHeight, hh = vis.offsetHeight;
  if (H > 0 && hh > H + 2){
    vis.style.transformOrigin = 'center center';
    vis.style.transform = 'scale(' + (H / hh) + ')';
  }
}
function autofit(){
  var sl = $('deck').querySelector('.slide.on'); if (!sl) return;
  fitVisual(sl);
  sl.querySelectorAll('.items, .caps').forEach(function(box){
    var k = 1; box.style.setProperty('--k', 1);
    while (box.scrollHeight > box.clientHeight + 4 && k > MIN_K){
      k = Math.round((k - 0.02) * 100) / 100;
      box.style.setProperty('--k', k);
    }
  });
}
function refit(){ requestAnimationFrame(function(){ requestAnimationFrame(autofit); }); }
function show(){
  var all = $('deck').querySelectorAll('.slide');
  for (var i=0;i<all.length;i++) all[i].classList.toggle('on', i === IDX);
  autofit(); refit();
  // ★ 封面依序登場：每次回到封面都重播
  var lc = $('deck').querySelector('.slide.on.light');
  if (lc){ lc.classList.remove('play'); void lc.offsetWidth; lc.classList.add('play'); }
  // ★ 這頁的圖載完要再量一次，否則量到的是「圖還沒出現」的高度
  var on = $('deck').querySelector('.slide.on');
  if (on) on.querySelectorAll('img').forEach(function(im){
    if (!im.complete) { im.addEventListener('load', refit, {once:true});
                        im.addEventListener('error', refit, {once:true}); }
  });
  applySteps();
  renderNotes();
  if (ROUTE === '_dev') expandAll();
}

function applySteps(){
  var st = steps();
  for (var i=0;i<st.length;i++) st[i].classList.toggle('shown', i < STEP);

  if (lc) lc.classList.toggle('reveal', STEP >= 1);
  setPhone();
}
function expandAll(){ STEP = steps().length; applySteps(); }

function next(){
  if (STEP < steps().length){ STEP++; applySteps(); return; }
  if (IDX < SLIDES.length - 1){ IDX++; STEP = 0; show(); }
}
function prev(){
  if (STEP > 0){ STEP--; applySteps(); return; }
  if (IDX > 0){ IDX--; show(); expandAll(); }   // 退回上一頁自動全展開
}
function goto(i){ IDX = i; STEP = 0; show(); closeGrid(); }

/* ================= 簡報者視窗 =================

   斷線也不會卡住；反過來也能按上下頁控制主視窗。

var PRESWIN = null;

function openPresenter(){
  if (PRESWIN && !PRESWIN.closed){ PRESWIN.focus(); return; }
  PRESWIN = window.open('', 'wzPresenter', 'width=1060,height=760');
  if (!PRESWIN){
    alert('瀏覽器擋掉了新視窗。\n請在網址列右邊允許「彈出式視窗」，再按一次 P。');
    return;
  }
  PRESWIN.document.open();
  PRESWIN.document.write(_presenterDoc());
  PRESWIN.document.close();
}

function presenterState(){
  var s = SLIDES[IDX] || {}, nx = SLIDES[IDX+1] || null;
  return {
    idx: IDX, total: SLIDES.length, step: STEP,
    route: routeName(), ver: (DATA.meta && DATA.meta.ver) || '',
    title: String(s.title || '').replace(/<br>/g, ' '),
    lead: s.lead || '',
    steps: (s.steps || s.items || []).map(function(c){ return { h: c.h || '', p: c.p || '' }; }),
    notes: s.notes || '',
    next: nx ? String(nx.title || '').replace(/<br>/g, ' ') : '（最後一頁）'
  };
}

function renderNotes(){
  var s = SLIDES[IDX] || {};
  $('notes').innerHTML = '<b>// 講稿</b>' + (s.notes || '（這頁沒有講稿）');
  $('notes').classList.toggle('on', NOTE_ON);
}
function toggleNotes(){ NOTE_ON = !NOTE_ON; renderNotes(); }

/* ---------- 計時器 ---------- */
var T0 = null, TI = null;
function toggleTimer(){
  if (TI){ clearInterval(TI); TI = null; $('timer').classList.remove('on'); return; }
  T0 = Date.now(); $('timer').classList.add('on');
  TI = setInterval(function(){
    var s = Math.floor((Date.now()-T0)/1000), p = function(n){ return (n<10?'0':'')+n; };
    $('timer').textContent = p(Math.floor(s/60)) + ':' + p(s%60);
  }, 500);
}

/* ---------- 內容編輯器（展示「可更新」用） ---------- */
function fit(){
  var s = Math.min(innerWidth/1600, innerHeight/900);
  $('stage').style.transform = 'scale(' + s + ')';
}
addEventListener('resize', function(){ fit(); autofit(); });

/* ---------- 操作 ---------- */
addEventListener('keydown', function(e){
  var k = e.key;
  if (!ROUTE){
    if (k === 'ArrowLeft'){ e.preventDefault(); csMove(-1); }
    else if (k === 'ArrowRight'){ e.preventDefault(); csMove(1); }
    else if (k === 'Enter' || k === ' '){ e.preventDefault(); startDeck(); }
    return;
  }
  if (k === 'ArrowRight' || k === 'PageDown' || k === ' '){ e.preventDefault(); next(); }
  else if (k === 'ArrowLeft' || k === 'PageUp'){ e.preventDefault(); prev(); }
  else if (k === 'ArrowDown'){ e.preventDefault(); expandAll(); }
  else if (k === 'p' || k === 'P'){ openPresenter(); }
  else if (k === 'o' || k === 'O'){ toggleGrid(); }
  else if (k === 'n' || k === 'N'){ toggleNotes(); }
  else if (k === 't' || k === 'T'){ toggleTimer(); }
  else if (k === 'r' || k === 'R'){ ROUTE = null; closeGrid(); renderRoutes(); }
  else if (k === 'f' || k === 'F'){
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen();
  }
  else if (k === 'Escape'){ closeGrid(); }
});
$('viewport').addEventListener('click', function(e){
  if (!ROUTE) return;
  if (e.target.closest('#grid,#routes,.btn')) return;
  next();
});
$('viewport').addEventListener('contextmenu', function(e){ e.preventDefault(); prev(); });

/* 滑鼠動才顯示角落提示，投影時乾淨 */
var _pk = null;
addEventListener('mousemove', function(){
  document.body.classList.add('peek');
  clearTimeout(_pk);
  _pk = setTimeout(function(){ document.body.classList.remove('peek'); }, 2500);
});

_motoFx = function(m){
  m = (m && typeof m === 'object') ? m : {};
  var v = function(k, d){ return (m[k] == null ? d : m[k]); };
  var st = '--hx:' + v('hx', 22) + '%;--hy:' + v('hy', 42) + '%;--hs:' + v('hs', .9) + ';' +
           '--tx:' + v('tx', 80) + '%;--ty:' + v('ty', 62) + '%;--ts:' + v('ts', .75) + ';' +
           '--ba:' + v('ba', -8) + 'deg;--bw:' + v('bw', 54) + '%;--bd:' + v('bd', -1) + ';' +
           '--px:' + v('px', 48) + '%;--pb:' + v('pb', 6) + '%;--pw:' + v('pw', 60) + '%';
  return '<div class="vp-moto' + (m.debug ? ' dbg' : '') + '" style="' + st + '">' +
    '<div class="mo-beam"></div><div class="mo-pool"></div>' +
    '<div class="mo-head"></div><div class="mo-core"></div><div class="mo-tail"></div>' +
    (m.debug ? '<div class="mo-hand h" data-k="h"></div>' +
               '<div class="mo-hand t" data-k="t"></div><div class="mo-hud"></div>' : '') +
    '</div>';
};

/* 拖曳校正：綠圈＝大燈、紫圈＝尾燈，左上角印出可直接貼回 JSON 的數字 */
function _motoWire(){
  document.querySelectorAll('.vp-moto.dbg').forEach(function(mo){
    if (mo._wired) return; mo._wired = 1;
    var hud = mo.querySelector('.mo-hud');
    function g(k){ return parseFloat(mo.style.getPropertyValue('--' + k)) || 0; }
    function dump(){
      hud.textContent = '拖綠圈＝大燈　拖紫圈＝尾燈\n' +
        '"hx": ' + g('hx').toFixed(1) + ', "hy": ' + g('hy').toFixed(1) + ',\n' +
        '"tx": ' + g('tx').toFixed(1) + ', "ty": ' + g('ty').toFixed(1);
    }
    mo.querySelectorAll('.mo-hand').forEach(function(h){
      h.addEventListener('pointerdown', function(e){
        e.preventDefault(); e.stopPropagation();
        var k = h.getAttribute('data-k'), box = mo.getBoundingClientRect();
        function mv(ev){
          var x = Math.max(0, Math.min(100, (ev.clientX - box.left) / box.width * 100));
          var y = Math.max(0, Math.min(100, (ev.clientY - box.top) / box.height * 100));
          mo.style.setProperty('--' + (k === 'h' ? 'hx' : 'tx'), x.toFixed(1) + '%');
          mo.style.setProperty('--' + (k === 'h' ? 'hy' : 'ty'), y.toFixed(1) + '%');
          dump();
        }
        function up(){ removeEventListener('pointermove', mv); removeEventListener('pointerup', up); }
        addEventListener('pointermove', mv); addEventListener('pointerup', up);
      });
    });
    dump();
  });
}

/* 每次換頁自動接線；拖把手時不要翻頁 */
(function(){
  var _oldShow = show;
  show = function(){ _oldShow.apply(this, arguments); _motoWire(); };

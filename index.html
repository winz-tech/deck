<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>穎利科技　教育訓練簡報引擎</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Chakra+Petch:wght@600;700&display=swap"
      rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --red:#E30613; --ink:#16161A; --paper:#F7F6F4; --dark:#101014;
  --sub:#6B6B75; --line:#DEDCD8;
  --done:#1F7A4D; --doing:#C8811A;
  --zh:'Noto Sans TC','Microsoft JhengHei',sans-serif;
  --en:'Chakra Petch','Microsoft JhengHei',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden;font-family:var(--zh)}

#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{width:1600px;height:900px;position:relative;transform-origin:center center;
  background:var(--paper);overflow:hidden;flex:none}

/* ---------- 共用版面 ---------- */
.slide{position:absolute;inset:0;display:none;flex-direction:column;padding:56px 90px 132px}
.slide.on{display:flex}
.slide.dark{background:var(--dark)}

.eyebrow{font-family:var(--en);font-weight:700;font-size:20px;letter-spacing:6px;
  color:var(--red);text-transform:uppercase;margin-bottom:10px}
.h1{font-size:64px;font-weight:900;color:var(--ink);line-height:1.18;letter-spacing:-1px}
.lead{font-size:26px;color:var(--sub);margin-top:16px;line-height:1.6}
.rule{width:120px;height:8px;background:var(--red);transform:skewX(-18deg);margin:26px 0 34px}

/* 封面 / 分段（深色） */
.dark .h1{color:#fff}
.dark .lead{color:#9A9AA6}
.cover-wrap{margin:auto 0;max-width:1200px}
.cover-title{font-size:88px;font-weight:900;color:#fff;line-height:1.16;letter-spacing:-2px}
.cover-sub{font-size:29px;color:#B9B9C4;margin-top:28px;line-height:1.6}
.cover-foot{position:absolute;left:90px;bottom:56px;font-family:var(--en);
  font-size:17px;letter-spacing:4px;color:#5A5A66}
.bigno{position:absolute;right:80px;bottom:30px;font-family:var(--en);font-weight:700;
  font-size:280px;color:rgba(227,6,19,.16);line-height:.8;letter-spacing:-10px}

/* 條列 */
.items{display:grid;gap:calc(20px*var(--k,1));align-content:start;flex:1;min-height:0;overflow:hidden}
.items.two{grid-template-columns:1fr 1fr;gap:calc(20px*var(--k,1)) 40px}
.item{display:flex;gap:20px;align-items:flex-start;
  border-left:6px solid var(--line);padding:calc(10px*var(--k,1)) 0 calc(10px*var(--k,1)) 22px}
.item .idx{font-family:var(--en);font-weight:700;font-size:20px;color:var(--red);
  padding-top:6px;flex:none;width:34px}
.item h3{font-size:calc(31px*var(--k,1));font-weight:900;color:var(--ink);line-height:1.35}
.item p{font-size:calc(24px*var(--k,1));color:var(--sub);line-height:1.6;margin-top:6px}

/* 逐步展開 */
.step{opacity:0;transform:translateY(16px);transition:opacity .32s ease,transform .32s ease}
.step.shown{opacity:1;transform:none}
.item.shown{border-left-color:var(--red)}

/* 待補頁 */
.todo-box{margin:auto;text-align:center}
.todo-box .tag{display:inline-block;font-family:var(--en);font-weight:700;font-size:18px;
  letter-spacing:4px;color:#fff;background:var(--doing);padding:8px 20px;
  transform:skewX(-18deg);margin-bottom:26px}
.todo-box .tag span{display:block;transform:skewX(18deg)}

/* 頁尾 */
.foot{position:absolute;left:90px;right:90px;bottom:30px;display:flex;align-items:center;
  border-top:1px solid var(--line);padding-top:14px;
  font-family:var(--en);font-size:15px;letter-spacing:2px;color:#9A9AA2}
.slide.dark .foot{border-color:rgba(255,255,255,.12);color:#5A5A66}
.foot .r{margin-left:auto;display:flex;gap:22px;align-items:center}
.foot .pill{background:var(--red);color:#fff;padding:3px 12px;transform:skewX(-18deg)}
.foot .pill span{display:block;transform:skewX(18deg)}

/* ---------- 路線選單 ---------- */
#routes{position:absolute;inset:0;background:var(--dark);padding:70px 90px;display:none;flex-direction:column}
#routes.on{display:flex}
#routes .h1{color:#fff;font-size:56px}
.rt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:44px}
.rt{background:#191920;border:1px solid rgba(255,255,255,.1);padding:30px 28px;cursor:pointer;
  text-align:left;color:#fff;font-family:var(--zh);transition:.15s;position:relative}
.rt:hover{background:#22222c;border-color:var(--red);transform:translateY(-3px)}
.rt .mk{width:44px;height:7px;background:var(--red);transform:skewX(-18deg);margin-bottom:18px}
.rt b{display:block;font-size:33px;font-weight:900;letter-spacing:1px}
.rt small{display:block;font-size:19px;color:#9A9AA6;margin-top:10px;line-height:1.5}
.rt.hot{border-color:var(--red);background:#241016}
.rt.dev .mk{background:#4A4A55}
.rt.dev b{color:#9A9AA6}


/* ---------- 活介面示範頁 ---------- */
.demo{display:flex;gap:56px;flex:1;min-height:0;align-items:center}
.demo .caps{flex:1;display:grid;gap:16px;align-content:center}
.cap{display:flex;gap:18px;align-items:flex-start;border-left:6px solid var(--line);padding:8px 0 8px 20px}
.cap .idx{font-family:var(--en);font-weight:700;font-size:19px;color:var(--red);width:32px;flex:none;padding-top:5px}
.cap h3{font-size:29px;font-weight:900;color:var(--ink);line-height:1.35}
.cap p{font-size:22px;color:var(--sub);line-height:1.6;margin-top:4px}
.cap.shown{border-left-color:var(--red)}

.phone{width:352px;flex:none;background:#0a0a0c;border:9px solid #26262c;border-radius:34px;
  padding:12px 12px 20px;box-shadow:0 22px 50px rgba(0,0,0,.3);position:relative;overflow:hidden}
.phone::before{content:'';position:absolute;top:12px;left:50%;transform:translateX(-50%);
  width:96px;height:6px;background:#26262c;border-radius:4px}
.pu-bar{display:flex;align-items:center;gap:8px;padding:16px 8px 8px;border-bottom:1px solid rgba(227,6,19,.35)}
.pu-bar .pg{font-family:var(--en);font-weight:700;font-size:10px;letter-spacing:3px;color:var(--red)}
.pu-bar .ck{margin-left:auto;font-family:var(--en);font-weight:600;font-size:12px;color:#fff;letter-spacing:1px}
.pu-card{background:#15151a;border:1px solid rgba(255,255,255,.08);border-radius:9px;
  padding:14px;margin:14px 4px;position:relative}
.pu-card::before,.pu-card::after{content:'';position:absolute;width:12px;height:12px;border:2px solid var(--red)}
.pu-card::before{top:-2px;left:-2px;border-right:none;border-bottom:none}
.pu-card::after{bottom:-2px;right:-2px;border-left:none;border-top:none}
.pu-date{font-family:var(--en);font-size:11px;letter-spacing:2px;color:#8a8a92}
.pu-name{font-size:18px;font-weight:700;color:#fff;margin:2px 0 11px}
.pu-row{display:flex;gap:9px}
.pu-cell{flex:1;background:#0e0e12;border:1px solid rgba(255,255,255,.08);border-radius:7px;padding:10px 4px;text-align:center}
.pu-lab{font-family:var(--en);font-size:9px;letter-spacing:1.5px;color:#8a8a92;margin-bottom:3px}
.pu-time{font-family:var(--en);font-weight:700;font-size:19px;color:#3a3a42;letter-spacing:1px}
.pu-cell.done{border-color:rgba(227,6,19,.5)}
.pu-cell.done .pu-time{color:var(--red);text-shadow:0 0 10px rgba(227,6,19,.55)}
.pu-btn{display:block;width:92%;margin:0 auto 13px;height:74px;border:none;border-radius:7px;
  transform:skewX(-18deg);position:relative;transition:.35s}
.pu-btn::before{content:'';position:absolute;inset:4px;border:1px solid rgba(255,255,255,.28);border-radius:4px}
.pu-btn .in2{transform:skewX(18deg);display:flex;flex-direction:column;align-items:center;
  justify-content:center;height:100%;gap:2px}
.pu-btn .zh{color:#fff;font-size:19px;font-weight:700;letter-spacing:5px;margin-right:-5px}
.pu-btn .en2{font-family:var(--en);font-weight:600;font-size:9px;letter-spacing:3px;color:rgba(255,255,255,.6)}
.pu-btn.i{background:linear-gradient(135deg,#E30613,#8f0009);box-shadow:0 0 18px rgba(227,6,19,.4),0 5px 0 rgba(0,0,0,.5)}
.pu-btn.o{background:linear-gradient(135deg,#2b4d6f,#16293c);border:1px solid rgba(120,190,255,.32);
  box-shadow:0 0 14px rgba(60,130,200,.3),0 5px 0 rgba(0,0,0,.5)}
.pu-btn.off{opacity:.3;filter:grayscale(1);box-shadow:none}
.pu-btn.off .zh{letter-spacing:2px;margin-right:-2px;font-size:17px}
.pu-btn.off .en2{letter-spacing:1px;font-size:11px;text-transform:none}
.pu-hint{text-align:center;font-size:11px;color:#ffb340;margin:-4px 0 8px;min-height:15px}

/* ---------- 總覽 ---------- */
#grid{position:absolute;inset:0;background:rgba(10,10,14,.97);display:none;
  padding:50px 60px;overflow:auto;z-index:40}
#grid.on{display:block}
.gwrap{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-top:26px}
.gcell{background:#1b1b22;border:1px solid rgba(255,255,255,.1);padding:16px;cursor:pointer;
  color:#fff;min-height:104px;text-align:left;font-family:var(--zh)}
.gcell:hover{border-color:var(--red);background:#26262f}
.gcell .n{font-family:var(--en);font-size:14px;color:var(--red);letter-spacing:2px}
.gcell .t{font-size:19px;font-weight:700;margin-top:8px;line-height:1.4}
.gcell.now{border-color:var(--red);background:#2d151a}

/* ---------- 講稿 / 編輯器 ---------- */
#notes{position:absolute;left:0;right:0;bottom:0;background:rgba(16,16,20,.97);color:#E8E8EF;
  padding:26px 90px;font-size:21px;line-height:1.7;display:none;z-index:35;
  border-top:3px solid var(--red);max-height:38%;overflow:auto}
#notes.on{display:block}
#notes b{color:var(--red);font-family:var(--en);letter-spacing:3px;font-size:15px;display:block;margin-bottom:8px}

#editor{position:absolute;inset:0;background:rgba(10,10,14,.98);z-index:60;display:none;
  padding:40px 60px;flex-direction:column;color:#fff}
#editor.on{display:flex}
#editor h2{font-size:30px;font-weight:900}
#editor p{color:#9A9AA6;font-size:19px;margin:10px 0 18px;line-height:1.6}
#editor textarea{flex:1;background:#15151b;color:#C8E6C9;border:1px solid #33333d;
  padding:18px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;line-height:1.6;resize:none}
#editor .row{display:flex;gap:14px;margin-top:18px;align-items:center}
.btn{background:var(--red);color:#fff;border:none;padding:14px 30px;font-size:19px;font-weight:900;
  cursor:pointer;font-family:var(--zh);transform:skewX(-18deg)}
.btn span{display:block;transform:skewX(18deg)}
.btn.ghost{background:#2a2a33}
#edmsg{color:#C8811A;font-size:18px}

/* ---------- 計時器 / 提示 ---------- */
#timer{position:absolute;right:26px;top:22px;font-family:var(--en);font-weight:700;font-size:26px;
  color:var(--red);background:rgba(255,255,255,.9);padding:6px 16px;display:none;z-index:30}
#timer.on{display:block}
#help,#src{position:fixed;bottom:10px;z-index:70;font-family:var(--en);font-size:12px;
  letter-spacing:2px;color:#4A4A55;background:rgba(0,0,0,.55);padding:5px 12px;
  opacity:0;transition:opacity .3s;pointer-events:none}
#help{left:12px} #src{right:12px;letter-spacing:1px}
body.peek #help, body.peek #src{opacity:1}
</style>
</head>
<body>

<div id="viewport"><div id="stage">
  <div id="routes"></div>
  <div id="deck"></div>
  <div id="grid"></div>
  <div id="notes"></div>
  <div id="timer">00:00</div>
  <div id="editor">
    <h2>簡報內容（貼上新的 JSON 就換一份簡報）</h2>
    <p>這個檔案本身不存內容。內容全在下面這份資料裡 —— 改它，簡報就更新，版型和互動不用重做。<br>
       正式上線時這份資料會放成外部的 <b>deck-data.json</b>，改那一個檔就好。</p>
    <textarea id="edtext" spellcheck="false"></textarea>
    <div class="row">
      <button class="btn" onclick="applyEdit()"><span>套用，重新產生簡報</span></button>
      <button class="btn ghost" onclick="toggleEditor(false)"><span>取消</span></button>
      <span id="edmsg"></span>
    </div>
  </div>
</div></div>

<div id="help">← → 翻頁 ｜ ↓ 全展開 ｜ O 總覽 ｜ N 講稿 ｜ T 計時 ｜ R 換路線 ｜ E 改內容 ｜ F 全螢幕</div>
<div id="src">—</div>

      ],
      "title": "用不順，直接說",
      "sub": "系統是為了讓大家少做一點事。<br>哪裡卡住、哪裡難用，講出來就會改。"
    }
  ]
};

var DATA = null, ROUTE = null, IDX = 0, STEP = 0, SLIDES = [];
var $ = function(id){ return document.getElementById(id); };
var esc = function(s){ return String(s == null ? '' : s); };

/* ---------- 載入 ---------- */
function boot(){
  fetch('deck-data.json', {cache:'no-store'})
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(j){ setData(j, '外部 deck-data.json'); })
    .catch(function(){ setData(FALLBACK, '內建快照（抓不到外部檔）'); });
}
function setData(j, src){
  DATA = j;
  $('src').textContent = '資料來源：' + src + ' ｜ ' + esc(j.meta && j.meta.ver);
  renderRoutes();
}

/* ---------- 路線選單 ---------- */
function renderRoutes(){
  var m = DATA.meta || {}, rs = DATA.routes || [];
  var h = '<div class="eyebrow">// Select Route</div>' +
          '<div class="h1">' + esc(m.title) + '</div>' +
          '<div class="lead">今天要帶誰走？點一個開始。</div><div class="rt-grid">';
  rs.forEach(function(r, i){
    h += '<button class="rt' + (r.hot?' hot':'') + (r.dev?' dev':'') + '" onclick="pick(\'' + r.id + '\')">' +
         '<div class="mk"></div><b>' + esc(r.name) + '</b><small>' + esc(r.desc) + '</small></button>';
  });
  h += '</div>';
  $('routes').innerHTML = h;
  $('routes').classList.add('on');
  $('deck').innerHTML = '';
}

function pick(id){
  ROUTE = id;
  SLIDES = (DATA.slides || []).filter(function(s){
    if (id === '_dev') return true;
    var r = s.roles || ['*'];
    return r.indexOf('*') > -1 || r.indexOf(id) > -1;
  });
  IDX = 0; STEP = 0;
  $('routes').classList.remove('on');
  buildDeck();
  show();
}

/* ---------- 產生投影片 ---------- */
function buildDeck(){
  var m = DATA.meta || {};
  var html = SLIDES.map(function(s, i){
    var dark = (s.type === 'cover' || s.type === 'section' || s.type === 'end');
    var body = '';

    if (s.type === 'cover'){
      body = '<div class="cover-wrap"><div class="eyebrow">// ' + esc(m.org) + '</div>' +
             '<div class="cover-title">' + esc(s.title) + '</div>' +
             '<div class="rule"></div>' +
             '<div class="cover-sub">' + esc(s.sub) + '</div></div>' +
             '<div class="cover-foot">' + esc(m.ver) + '</div>';
    }
    else if (s.type === 'section'){
      body = '<div class="cover-wrap"><div class="eyebrow">// Chapter ' + esc(s.no) + '</div>' +
             '<div class="cover-title">' + esc(s.title) + '</div>' +
             '<div class="rule"></div>' +
             '<div class="cover-sub">' + esc(s.sub) + '</div></div>' +
             '<div class="bigno">' + esc(s.no) + '</div>';
    }
    else if (s.type === 'end'){
      body = '<div class="cover-wrap" style="text-align:center;margin:auto">' +
             '<div class="cover-title">' + esc(s.title) + '</div>' +
             '<div class="rule" style="margin:30px auto 34px"></div>' +
             '<div class="cover-sub">' + esc(s.sub) + '</div></div>';
    }
    else if (s.type === 'todo'){
      body = '<div class="todo-box"><div class="tag"><span>尚未完成</span></div>' +
             '<div class="h1">' + esc(s.title) + '</div>' +
             '<div class="lead">' + esc(s.sub) + '</div></div>';
    }
    else if (s.type === 'demo'){
      body = '<div class="h1">' + esc(s.title) + '</div>' +
             (s.lead ? '<div class="lead">' + esc(s.lead) + '</div>' : '') +
             '<div class="rule"></div><div class="demo">' +
             '<div class="phone" id="ph' + i + '">' +
               '<div class="pu-bar"><div class="pg">// TIME ATTENDANCE</div><div class="ck">08:12:03</div></div>' +
               '<div class="pu-card"><div class="pu-date">2026/07/28　MON</div>' +
                 '<div class="pu-name">' + esc(s.who || '王小明') + '</div><div class="pu-row">' +
                 '<div class="pu-cell" data-c="in"><div class="pu-lab">CLOCK IN · 上班</div><div class="pu-time">--:--:--</div></div>' +
                 '<div class="pu-cell" data-c="out"><div class="pu-lab">CLOCK OUT · 下班</div><div class="pu-time">--:--:--</div></div>' +
               '</div></div>' +
               '<button class="pu-btn i"><span class="in2"><span class="zh">上班打卡</span><span class="en2">// CLOCK IN //</span></span></button>' +
               '<button class="pu-btn o"><span class="in2"><span class="zh">下班打卡</span><span class="en2">// CLOCK OUT //</span></span></button>' +
               '<div class="pu-hint"></div>' +
             '</div><div class="caps">' +
             (s.steps || []).map(function(c,k){
               var n = (k+1) < 10 ? '0'+(k+1) : (k+1);
               return '<div class="cap step"><div class="idx">' + n + '</div><div>' +
                      '<h3>' + esc(c.h) + '</h3>' + (c.p ? '<p>' + esc(c.p) + '</p>' : '') + '</div></div>';
             }).join('') + '</div></div>';
    }
    else { /* list */
      var its = s.items || [];
      var two = its.length > 6 ? ' two' : '';
      body = '<div class="h1">' + esc(s.title) + '</div>' +
             (s.lead ? '<div class="lead">' + esc(s.lead) + '</div>' : '') +
             '<div class="rule"></div><div class="items' + two + '">' +
             its.map(function(it, k){
               var n = (k+1) < 10 ? '0' + (k+1) : (k+1);
               return '<div class="item step"><div class="idx">' + n + '</div><div>' +
                      '<h3>' + esc(it.h) + '</h3>' +
                      (it.p ? '<p>' + esc(it.p) + '</p>' : '') + '</div></div>';
             }).join('') + '</div>';
    }

    var foot = '<div class="foot"><div>' + esc(m.title) + '</div><div class="r">' +
               '<div>' + esc(routeName()) + '</div>' +
               '<div class="pill"><span>' + (i+1) + ' / ' + SLIDES.length + '</span></div></div></div>';

    return '<div class="slide' + (dark?' dark':'') + '" data-i="' + i + '">' + body + foot + '</div>';
  }).join('');
  $('deck').innerHTML = html;
}
function routeName(){
  var r = (DATA.routes || []).filter(function(x){ return x.id === ROUTE; })[0];
  return r ? r.name : '';
}

/* ---------- 顯示 / 逐步展開 ---------- */
function autofit(){
  var sl = $('deck').querySelector('.slide.on'); if (!sl) return;
  var box = sl.querySelector('.items'); if (!box) return;
  var k = 1; box.style.setProperty('--k', 1);
  while (box.scrollHeight > box.clientHeight + 2 && k > 0.68){
    k = Math.round((k - 0.04) * 100) / 100;
    box.style.setProperty('--k', k);
  }
}
function show(){
  var all = $('deck').querySelectorAll('.slide');
  for (var i=0;i<all.length;i++) all[i].classList.toggle('on', i === IDX);
  autofit();
  applySteps();
  renderNotes();
  if (ROUTE === '_dev') expandAll();
}
function steps(){ return $('deck').querySelectorAll('.slide.on .step'); }

/* 活介面：依 STEP 推進手機畫面 */
function setPhone(){
  var sl = $('deck').querySelector('.slide.on'); if (!sl) return;
  var ph = sl.querySelector('.phone'); if (!ph) return;
  var s = SLIDES[IDX] || {}, cf = (s.steps || [])[Math.max(0, STEP-1)] || {};
  var st = cf.state || 'idle';
  var cIn = ph.querySelector('[data-c=in]'),  tIn  = cIn.querySelector('.pu-time');
  var cOut= ph.querySelector('[data-c=out]'), tOut = cOut.querySelector('.pu-time');
  var bIn = ph.querySelector('.pu-btn.i'),    bOut = ph.querySelector('.pu-btn.o');
  var hint= ph.querySelector('.pu-hint');
  function set(b, off, zh, en){
    b.classList.toggle('off', !!off);
    b.querySelector('.zh').textContent = zh;
    b.querySelector('.en2').textContent = en;
  }
  var inDone  = (st === 'in' || st === 'out');
  var outDone = (st === 'out');
  tIn.textContent  = inDone  ? '08:12:03' : '--:--:--';
  tOut.textContent = outDone ? '18:04:22' : '--:--:--';
  cIn.classList.toggle('done', inDone);
  cOut.classList.toggle('done', outDone);
  set(bIn,  inDone,  inDone  ? '早安，今天加油' : '上班打卡', inDone  ? '記得吃早餐 · 08:12:03'   : '// CLOCK IN //');
  set(bOut, outDone, outDone ? '今天辛苦了'     : '下班打卡', outDone ? '回家路上請小心 · 18:04:22' : '// CLOCK OUT //');
  hint.textContent = cf.hint || '';
}
function applySteps(){
  var st = steps();
  for (var i=0;i<st.length;i++) st[i].classList.toggle('shown', i < STEP);
  setPhone();
}
function expandAll(){ STEP = steps().length; applySteps(); }

function next(){
  if (STEP < steps().length){ STEP++; applySteps(); return; }
  if (IDX < SLIDES.length - 1){ IDX++; STEP = 0; show(); }
}
function prev(){
  if (STEP > 0){ STEP--; applySteps(); return; }
  if (IDX > 0){ IDX--; show(); expandAll(); }   // 退回上一頁自動全展開
}
function goto(i){ IDX = i; STEP = 0; show(); closeGrid(); }


/* ---------- 總覽 ---------- */
function toggleGrid(){
  var g = $('grid');
  if (g.classList.contains('on')) return closeGrid();
  var h = '<div class="eyebrow">// Overview</div><div class="h1" style="color:#fff">' +
          routeName() + '　共 ' + SLIDES.length + ' 頁</div><div class="gwrap">';
  SLIDES.forEach(function(s,i){
    h += '<button class="gcell' + (i===IDX?' now':'') + '" onclick="goto(' + i + ')">' +
         '<div class="n">' + (i+1) + '</div><div class="t">' + esc(s.title || s.sub || '—') + '</div></button>';
  });
  g.innerHTML = h + '</div>';
  g.classList.add('on');
}
function closeGrid(){ $('grid').classList.remove('on'); }

/* ---------- 講稿 ---------- */
var NOTE_ON = false;
function renderNotes(){
  var s = SLIDES[IDX] || {};
  $('notes').innerHTML = '<b>// 講稿</b>' + (s.notes || '（這頁沒有講稿）');
  $('notes').classList.toggle('on', NOTE_ON);
}
function toggleNotes(){ NOTE_ON = !NOTE_ON; renderNotes(); }

/* ---------- 計時器 ---------- */
var T0 = null, TI = null;
function toggleTimer(){
  if (TI){ clearInterval(TI); TI = null; $('timer').classList.remove('on'); return; }
  T0 = Date.now(); $('timer').classList.add('on');
  TI = setInterval(function(){
    var s = Math.floor((Date.now()-T0)/1000), p = function(n){ return (n<10?'0':'')+n; };
    $('timer').textContent = p(Math.floor(s/60)) + ':' + p(s%60);
  }, 500);
}

/* ---------- 內容編輯器（展示「可更新」用） ---------- */
function toggleEditor(on){
  if (on){ $('edtext').value = JSON.stringify(DATA, null, 2); $('edmsg').textContent = ''; }
  $('editor').classList.toggle('on', !!on);
}
function applyEdit(){
  try{
    var j = JSON.parse($('edtext').value);
    setData(j, '手動貼上');
    toggleEditor(false);
  }catch(e){
    $('edmsg').textContent = 'JSON 格式有誤：' + e.message;
  }
}

/* ---------- 縮放：固定 1600×900 舞台 ---------- */
function fit(){
  var s = Math.min(innerWidth/1600, innerHeight/900);
  $('stage').style.transform = 'scale(' + s + ')';
}
addEventListener('resize', function(){ fit(); autofit(); });

/* ---------- 操作 ---------- */
addEventListener('keydown', function(e){
  var k = e.key;
  if ($('editor').classList.contains('on')){ if (k === 'Escape') toggleEditor(false); return; }
  if (!ROUTE){ return; }
  if (k === 'ArrowRight' || k === 'PageDown' || k === ' '){ e.preventDefault(); next(); }
  else if (k === 'ArrowLeft' || k === 'PageUp'){ e.preventDefault(); prev(); }
  else if (k === 'ArrowDown'){ e.preventDefault(); expandAll(); }
  else if (k === 'o' || k === 'O'){ toggleGrid(); }
  else if (k === 'n' || k === 'N'){ toggleNotes(); }
  else if (k === 't' || k === 'T'){ toggleTimer(); }
  else if (k === 'e' || k === 'E'){ toggleEditor(true); }
  else if (k === 'r' || k === 'R'){ ROUTE = null; closeGrid(); renderRoutes(); }
  else if (k === 'f' || k === 'F'){
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen();
  }
  else if (k === 'Escape'){ closeGrid(); }
});
$('viewport').addEventListener('click', function(e){
  if (!ROUTE) return;
  if (e.target.closest('#editor,#grid,#routes,.btn')) return;
  next();
});
$('viewport').addEventListener('contextmenu', function(e){ e.preventDefault(); prev(); });

/* 滑鼠動才顯示角落提示，投影時乾淨 */
var _pk = null;
addEventListener('mousemove', function(){
  document.body.classList.add('peek');
  clearTimeout(_pk);
  _pk = setTimeout(function(){ document.body.classList.remove('peek'); }, 2500);
});

/* 網址帶路線：?route=qc 直接開 */
fit();
boot();
setTimeout(function(){
  var m = location.search.match(/[?&]route=([^&]+)/);
  if (m && DATA) pick(decodeURIComponent(m[1]));
}, 400);
</script>
</body>
</html>

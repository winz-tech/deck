<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>穎利科技　教育訓練簡報引擎</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Chakra+Petch:wght@600;700&display=swap"
      rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --red:#E30613; --ink:#16161A; --paper:#F7F6F4; --dark:#101014;
  --sub:#6B6B75; --line:#DEDCD8;
  --done:#1F7A4D; --doing:#C8811A;
  --zh:'Noto Sans TC','Microsoft JhengHei',sans-serif;
  --en:'Chakra Petch','Microsoft JhengHei',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden;font-family:var(--zh)}

#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{width:1600px;height:900px;position:relative;transform-origin:center center;
  background:var(--paper);overflow:hidden;flex:none}

/* ---------- 共用版面 ---------- */
.slide{position:absolute;inset:0;display:none;flex-direction:column;padding:56px 90px 132px}
.slide.on{display:flex}
.slide.dark{background:var(--dark)}

.eyebrow{font-family:var(--en);font-weight:700;font-size:20px;letter-spacing:6px;
  color:var(--red);text-transform:uppercase;margin-bottom:10px}
.h1{font-size:64px;font-weight:900;color:var(--ink);line-height:1.18;letter-spacing:-1px}
.lead{font-size:26px;color:var(--sub);margin-top:16px;line-height:1.6}
.rule{width:120px;height:8px;background:var(--red);transform:skewX(-18deg);margin:26px 0 34px}

/* 封面 / 分段（深色） */
.dark .h1{color:#fff}
.dark .lead{color:#9A9AA6}
.cover-wrap{margin:auto 0;max-width:1200px}
.cover-title{font-size:88px;font-weight:900;color:#fff;line-height:1.16;letter-spacing:-2px}
.cover-sub{font-size:29px;color:#B9B9C4;margin-top:28px;line-height:1.6}
.cover-foot{position:absolute;left:90px;bottom:56px;font-family:var(--en);
  font-size:17px;letter-spacing:4px;color:#5A5A66}
.bigno{position:absolute;right:80px;bottom:30px;font-family:var(--en);font-weight:700;
  font-size:280px;color:rgba(227,6,19,.16);line-height:.8;letter-spacing:-10px}

/* 條列 */
.items{display:grid;gap:calc(20px*var(--k,1));align-content:start;flex:1;min-height:0;overflow:hidden}
.items.two{grid-template-columns:1fr 1fr;gap:calc(20px*var(--k,1)) 40px}
.item{display:flex;gap:20px;align-items:flex-start;
  border-left:6px solid var(--line);padding:calc(10px*var(--k,1)) 0 calc(10px*var(--k,1)) 22px}
.item .idx{font-family:var(--en);font-weight:700;font-size:20px;color:var(--red);
  padding-top:6px;flex:none;width:34px}
.item h3{font-size:calc(31px*var(--k,1));font-weight:900;color:var(--ink);line-height:1.35}
.item p{font-size:calc(24px*var(--k,1));color:var(--sub);line-height:1.6;margin-top:6px}

/* 逐步展開 */
.step{opacity:0;transform:translateY(16px);transition:opacity .32s ease,transform .32s ease}
.step.shown{opacity:1;transform:none}
.item.shown{border-left-color:var(--red)}

/* 待補頁 */
.todo-box{margin:auto;text-align:center}
.todo-box .tag{display:inline-block;font-family:var(--en);font-weight:700;font-size:18px;
  letter-spacing:4px;color:#fff;background:var(--doing);padding:8px 20px;
  transform:skewX(-18deg);margin-bottom:26px}
.todo-box .tag span{display:block;transform:skewX(18deg)}

/* 頁尾 */
.foot{position:absolute;left:90px;right:90px;bottom:30px;display:flex;align-items:center;
  border-top:1px solid var(--line);padding-top:14px;
  font-family:var(--en);font-size:15px;letter-spacing:2px;color:#9A9AA2}
.slide.dark .foot{border-color:rgba(255,255,255,.12);color:#5A5A66}
.foot .r{margin-left:auto;display:flex;gap:22px;align-items:center}
.foot .pill{background:var(--red);color:#fff;padding:3px 12px;transform:skewX(-18deg)}
.foot .pill span{display:block;transform:skewX(18deg)}

/* ---------- 路線選單 ---------- */
#routes{position:absolute;inset:0;background:var(--dark);padding:70px 90px;display:none;flex-direction:column}
#routes.on{display:flex}
#routes .h1{color:#fff;font-size:56px}
.rt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:44px}
.rt{background:#191920;border:1px solid rgba(255,255,255,.1);padding:30px 28px;cursor:pointer;
  text-align:left;color:#fff;font-family:var(--zh);transition:.15s;position:relative}
.rt:hover{background:#22222c;border-color:var(--red);transform:translateY(-3px)}
.rt .mk{width:44px;height:7px;background:var(--red);transform:skewX(-18deg);margin-bottom:18px}
.rt b{display:block;font-size:33px;font-weight:900;letter-spacing:1px}
.rt small{display:block;font-size:19px;color:#9A9AA6;margin-top:10px;line-height:1.5}
.rt.hot{border-color:var(--red);background:#241016}
.rt.dev .mk{background:#4A4A55}
.rt.dev b{color:#9A9AA6}


/* ---------- 活介面示範頁 ---------- */
.demo{display:grid;grid-template-columns:760px 1fr;gap:46px;flex:1;min-height:0;align-items:center;overflow:hidden}
.demo.d-phone{grid-template-columns:400px 1fr}
.demo .caps{display:grid;gap:calc(16px*var(--k,1));align-content:center;overflow:hidden;min-height:0}
.cap{display:flex;gap:16px;align-items:flex-start;border-left:6px solid var(--line);padding:calc(6px*var(--k,1)) 0 calc(6px*var(--k,1)) 18px}
.cap .idx{font-family:var(--en);font-weight:700;font-size:19px;color:var(--red);width:32px;flex:none;padding-top:5px}
.cap h3{font-size:calc(31px*var(--k,1));font-weight:900;color:var(--ink);line-height:1.3}
.cap p{font-size:calc(24px*var(--k,1));color:var(--sub);line-height:1.55;margin-top:4px}
.cap.shown{border-left-color:var(--red)}

.phone{width:352px;justify-self:center;background:#0a0a0c;border:9px solid #26262c;border-radius:34px;
  padding:12px 12px 20px;box-shadow:0 22px 50px rgba(0,0,0,.3);position:relative;overflow:hidden}
.phone::before{content:'';position:absolute;top:12px;left:50%;transform:translateX(-50%);
  width:96px;height:6px;background:#26262c;border-radius:4px}
.pu-bar{display:flex;align-items:center;gap:8px;padding:16px 8px 8px;border-bottom:1px solid rgba(227,6,19,.35)}
.pu-bar .pg{font-family:var(--en);font-weight:700;font-size:10px;letter-spacing:3px;color:var(--red)}
.pu-bar .ck{margin-left:auto;font-family:var(--en);font-weight:600;font-size:12px;color:#fff;letter-spacing:1px}
.pu-card{background:#15151a;border:1px solid rgba(255,255,255,.08);border-radius:9px;
  padding:14px;margin:14px 4px;position:relative}
.pu-card::before,.pu-card::after{content:'';position:absolute;width:12px;height:12px;border:2px solid var(--red)}
.pu-card::before{top:-2px;left:-2px;border-right:none;border-bottom:none}
.pu-card::after{bottom:-2px;right:-2px;border-left:none;border-top:none}
.pu-date{font-family:var(--en);font-size:11px;letter-spacing:2px;color:#8a8a92}
.pu-name{font-size:18px;font-weight:700;color:#fff;margin:2px 0 11px}
.pu-row{display:flex;gap:9px}
.pu-cell{flex:1;background:#0e0e12;border:1px solid rgba(255,255,255,.08);border-radius:7px;padding:10px 4px;text-align:center}
.pu-lab{font-family:var(--en);font-size:9px;letter-spacing:1.5px;color:#8a8a92;margin-bottom:3px}
.pu-time{font-family:var(--en);font-weight:700;font-size:19px;color:#3a3a42;letter-spacing:1px}
.pu-cell.done{border-color:rgba(227,6,19,.5)}
.pu-cell.done .pu-time{color:var(--red);text-shadow:0 0 10px rgba(227,6,19,.55)}
.pu-btn{display:block;width:92%;margin:0 auto 13px;height:74px;border:none;border-radius:7px;
  transform:skewX(-18deg);position:relative;transition:.35s}
.pu-btn::before{content:'';position:absolute;inset:4px;border:1px solid rgba(255,255,255,.28);border-radius:4px}
.pu-btn .in2{transform:skewX(18deg);display:flex;flex-direction:column;align-items:center;
  justify-content:center;height:100%;gap:2px}
.pu-btn .zh{color:#fff;font-size:19px;font-weight:700;letter-spacing:5px;margin-right:-5px}
.pu-btn .en2{font-family:var(--en);font-weight:600;font-size:9px;letter-spacing:3px;color:rgba(255,255,255,.6)}
.pu-btn.i{background:linear-gradient(135deg,#E30613,#8f0009);box-shadow:0 0 18px rgba(227,6,19,.4),0 5px 0 rgba(0,0,0,.5)}
.pu-btn.o{background:linear-gradient(135deg,#2b4d6f,#16293c);border:1px solid rgba(120,190,255,.32);
  box-shadow:0 0 14px rgba(60,130,200,.3),0 5px 0 rgba(0,0,0,.5)}
.pu-btn.off{opacity:.3;filter:grayscale(1);box-shadow:none}
.pu-btn.off .zh{letter-spacing:2px;margin-right:-2px;font-size:17px}
.pu-btn.off .en2{letter-spacing:1px;font-size:11px;text-transform:none}
.pu-hint{text-align:center;font-size:11px;color:#ffb340;margin:-4px 0 8px;min-height:15px}

/* ---------- 訂會議室活介面 ---------- */
.bk{width:100%;background:#111116;border:1px solid rgba(227,6,19,.3);border-radius:12px;
  padding:20px;box-shadow:0 18px 44px rgba(0,0,0,.3);position:relative;overflow:hidden}
.bk .part{transition:opacity .35s,filter .35s}
.bk.focusing .part{opacity:.26;filter:saturate(.3)}
.bk.focusing .part.hit{opacity:1;filter:none;position:relative;z-index:2}
.bk.focusing .part.hit::after{content:'';position:absolute;inset:-8px;border:2px solid var(--red);
  border-radius:9px;box-shadow:0 0 18px rgba(227,6,19,.55);pointer-events:none}
.bk-hd{font-family:var(--en);font-size:11px;letter-spacing:3px;color:var(--red);
  font-weight:700;margin-bottom:14px}
.bk-r{display:flex;gap:12px;margin-bottom:11px}
.bk-f{display:flex;flex-direction:column;gap:4px;font-size:11px;letter-spacing:1px;color:#8a8a92}
.bk-f.g{flex:1}
.bk-in{background:#0e0e12;border:1px solid rgba(255,255,255,.18);border-radius:7px;
  padding:9px 10px;font-size:14px;color:#fff;white-space:nowrap;overflow:hidden}
.bk-in.sel::after{content:'▾';float:right;color:#8a8a92}
.bk-in.ph{color:#55555e}
.bk-warn{font-size:13px;padding:9px 11px;border-radius:7px;margin-bottom:11px;display:none}
.bk-warn.on{display:block}
.bk-warn.ok{background:rgba(79,208,106,.12);border:1px solid rgba(79,208,106,.4);color:#7ee08f}
.bk-warn.bad{background:rgba(227,6,19,.14);border:1px solid rgba(227,6,19,.45);color:#ff8a90}
.bk-att{background:#0e0e12;border:1px solid rgba(255,255,255,.18);border-radius:7px;padding:7px}
.bk-ai{display:flex;align-items:center;gap:9px;padding:6px 6px;border-radius:5px;
  font-size:13px;color:#cfcfcf}
.bk-ck{width:15px;height:15px;border-radius:4px;border:1.5px solid #4a4a55;flex:none}
.bk-ai.on .bk-ck{background:var(--red);border-color:var(--red)}
.bk-ai .lv{margin-left:auto;font-size:11px;padding:2px 9px;border-radius:9px;
  background:rgba(255,255,255,.1);color:#8a8a92;white-space:nowrap}
.bk-ai .lv.out{background:rgba(255,150,40,.2);color:#ffb066}
.bk-ai .lv.off{background:rgba(227,6,19,.2);color:#ff8a90}
.bk-rep{display:flex;align-items:center;gap:9px;font-size:12px;color:#8a8a92;
  margin:12px 0 4px;flex-wrap:wrap}
.bk-chip{border:1px solid rgba(255,255,255,.2);border-radius:6px;padding:4px 10px;color:#cfcfcf}
.bk-chip.on{background:var(--red);border-color:var(--red);color:#fff}
.bk-to{color:#ff8a90}
.bk-ft{display:flex;align-items:center;gap:11px;margin-top:14px}
.bk-ft .lb{font-size:13px;color:#cfcfcf;display:flex;align-items:center;gap:7px}
.bk-go{margin-left:auto;background:linear-gradient(135deg,#E30613,#8f0009);color:#fff;
  font-size:14px;font-weight:700;padding:10px 22px;border-radius:8px}

/* ---------- 白底封面 ---------- */
.slide.light{background:#fff}
.lc-mark{position:absolute;right:-150px;top:-120px;width:760px;height:760px;
  background:linear-gradient(135deg,rgba(227,6,19,.09),rgba(227,6,19,0));
  transform:skewX(-18deg);pointer-events:none}
.lc-bar{position:absolute;left:0;top:0;bottom:0;width:16px;background:var(--red)}
.lc-wrap{margin:auto 0;max-width:1150px;position:relative;z-index:2}
.lc-logo{height:104px;width:auto;display:block;margin-bottom:34px}
.lc-eyebrow{font-family:var(--en);font-weight:700;font-size:19px;letter-spacing:7px;
  color:var(--red);text-transform:uppercase;margin-bottom:18px}
.lc-title{font-size:82px;font-weight:900;color:var(--ink);line-height:1.16;letter-spacing:-2px}
.lc-rule{width:150px;height:10px;background:var(--red);transform:skewX(-18deg);margin:30px 0 26px}
.lc-sub{font-size:29px;color:var(--sub);line-height:1.6}
.lc-foot{position:absolute;left:96px;right:96px;bottom:64px;display:flex;align-items:flex-end;
  border-top:2px solid var(--line);padding-top:22px;z-index:2}
.lc-sp{display:flex;align-items:center;gap:18px}
.lc-sp .tag{font-family:var(--en);font-size:14px;letter-spacing:4px;color:var(--sub);
  text-transform:uppercase;writing-mode:vertical-rl;text-orientation:upright;
  border-right:2px solid var(--red);padding-right:10px;line-height:1}
.lc-sp .who b{display:block;font-size:40px;font-weight:900;color:var(--ink);line-height:1.15}
.lc-sp .who i{display:block;font-family:var(--en);font-weight:700;font-size:21px;
  letter-spacing:3px;color:var(--red);font-style:normal;margin-top:4px}
.lc-meta{margin-left:auto;text-align:right;font-family:var(--en);font-size:16px;
  letter-spacing:3px;color:var(--sub);line-height:1.9}

/* ---------- 自己的圖（截圖／照片）+ 聚光燈 ---------- */
.shot{width:100%;position:relative;border-radius:10px;overflow:hidden;
  box-shadow:0 18px 44px rgba(0,0,0,.28);background:#000;max-height:100%}
.shot img{display:block;width:100%;height:auto;max-height:100%;object-fit:contain}
.shot .spot{position:absolute;border:3px solid var(--red);border-radius:6px;
  box-shadow:0 0 0 9999px rgba(8,8,12,.66), 0 0 22px rgba(227,6,19,.7);
  opacity:0;transition:opacity .35s, all .45s cubic-bezier(.3,.9,.4,1);pointer-events:none}
.shot .spot.on{opacity:1}
.shot .ver{position:absolute;right:8px;bottom:8px;font-family:var(--en);font-size:12px;
  letter-spacing:1px;color:#fff;background:rgba(0,0,0,.55);padding:3px 9px;border-radius:4px;z-index:5}
.shot .miss{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:#17171c;color:#8a8a92;font-size:19px;text-align:center;padding:30px;line-height:1.7}

/* ---------- 作業中心活介面 ---------- */

.hub{width:100%;background:#0a0a0c;border:9px solid #26262c;border-radius:14px;
  padding:0;overflow:hidden;box-shadow:0 22px 50px rgba(0,0,0,.32);position:relative;
  background-image:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);
  background-size:26px 26px}
.hub .part{transition:opacity .35s,filter .35s}
.hub.focusing .part{opacity:.28;filter:saturate(.3)}
.hub.focusing .part.hit{opacity:1;filter:none}
.hub .part.hit{position:relative;z-index:2}
.hub.focusing .part.hit::after{content:'';position:absolute;inset:-7px;border:2px solid #E30613;
  border-radius:9px;box-shadow:0 0 18px rgba(227,6,19,.6);pointer-events:none}

.hu-top{display:flex;align-items:center;gap:9px;padding:9px 12px;
  background:linear-gradient(135deg,#1a0000,#2d0000,#1a0000);
  border-bottom:1px solid rgba(227,6,19,.28)}
.hu-brand{font-size:13px;font-weight:900;color:#fff;letter-spacing:1px}
.hu-en{font-family:var(--en);font-size:8px;letter-spacing:2px;color:rgba(255,255,255,.35)}
.hu-user{margin-left:auto;display:flex;align-items:center;gap:8px}
.hu-un{font-size:11px;color:#fff;text-align:right;line-height:1.3}
.hu-un i{display:block;font-style:normal;font-size:9px;color:rgba(255,255,255,.42)}
.hu-av{width:26px;height:26px;border-radius:50%;background:#E30613;color:#fff;font-size:12px;
  font-weight:700;display:flex;align-items:center;justify-content:center}
.hu-out{font-size:10px;color:#ff8a90;border:1px solid rgba(227,6,19,.7);
  background:rgba(227,6,19,.14);border-radius:6px;padding:4px 8px;font-weight:700}

.hu-body{padding:12px}
.hu-hi{font-size:16px;color:#fff;font-weight:300;margin-bottom:10px}
.hu-hi b{font-weight:900}
.hu-cal{display:flex;align-items:center;gap:12px;padding:9px 12px;margin-bottom:12px;
  background:rgba(255,255,255,.03);border:1px solid rgba(227,6,19,.22);border-radius:10px}
.hu-cal .lab{font-family:var(--en);font-size:8px;letter-spacing:2px;color:rgba(255,255,255,.32)}
.hu-cal .msg{font-size:11px;color:rgba(255,255,255,.85);margin-top:3px}
.hu-cal .msg b{color:#ff6168}
.hu-track{flex:1;height:26px;position:relative;border-bottom:1px solid rgba(255,255,255,.12);min-width:0}
.hu-ev{position:absolute;bottom:4px;height:13px;border-radius:3px;font-size:8px;line-height:13px;
  padding:0 5px;color:#fff;white-space:nowrap;overflow:hidden}
.hu-now{position:absolute;top:0;bottom:0;width:2px;background:#E30613;box-shadow:0 0 7px rgba(227,6,19,.9)}
.hu-calbtn{font-size:10px;font-weight:700;color:#fff;padding:7px 11px;border-radius:7px;
  background:linear-gradient(135deg,#E30613,#8f0009);transform:skewX(-18deg);white-space:nowrap}
.hu-calbtn span{display:block;transform:skewX(18deg)}

.hu-work{display:flex;gap:11px;align-items:flex-start}
.hu-nav{width:118px;flex:none;display:flex;flex-direction:column;gap:4px}
.hu-nt{font-family:var(--en);font-size:8px;letter-spacing:2px;color:rgba(255,255,255,.3);padding:0 6px 3px}
.hu-z{display:flex;align-items:center;gap:7px;padding:7px 8px;border-radius:8px;
  background:rgba(255,255,255,.025);border:1px solid transparent}
.hu-z i{width:19px;height:19px;border-radius:5px;background:rgba(227,6,19,.14);flex:none;
  font-style:normal;font-size:10px;display:flex;align-items:center;justify-content:center}
.hu-z i img,.hu-c .ic img,.hu-fi i img{width:100%;height:100%;object-fit:cover;display:block;border-radius:5px}
.hu-z i.hasimg,.hu-c .ic.hasimg,.hu-fi i.hasimg{background:transparent}
.hu-z b{font-size:10px;font-weight:600;color:rgba(255,255,255,.72);white-space:nowrap}
.hu-z.on{background:rgba(227,6,19,.16);border-color:rgba(227,6,19,.6)}
.hu-z.on i{background:#E30613}
.hu-z.on b{color:#fff}

.hu-cards{flex:1;min-width:0;display:grid;grid-template-columns:1fr 1fr;gap:9px;align-content:start}
.hu-c{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08);border-radius:10px;
  padding:11px;position:relative}
.hu-c .ic{width:27px;height:27px;border-radius:7px;background:#E30613;font-size:14px;
  display:flex;align-items:center;justify-content:center;margin-bottom:7px}
.hu-c .nm{font-size:11px;font-weight:700;color:#fff;padding-right:20px}
.hu-c .ds{font-size:9px;color:rgba(255,255,255,.4);line-height:1.5;margin-top:3px}
.hu-c .st{position:absolute;top:7px;right:7px;width:18px;height:18px;border-radius:50%;
  background:rgba(0,0,0,.25);color:rgba(255,255,255,.25);font-size:10px;
  display:flex;align-items:center;justify-content:center;transition:.3s}
.hub.pinned .hu-c.pin .st{color:#FFD700;text-shadow:0 0 8px rgba(255,215,0,.8);transform:scale(1.25)}

.hu-fav{width:124px;flex:none;border:1px solid rgba(227,6,19,.22);border-radius:10px;
  padding:9px;background:rgba(227,6,19,.04)}
.hu-fh{display:flex;align-items:center;gap:5px;margin-bottom:7px}
.hu-fh .s{color:#FFD700;font-size:9px}
.hu-fh .t{font-size:9px;font-weight:700;letter-spacing:1px;color:rgba(255,255,255,.7)}
.hu-fe{font-size:9px;color:rgba(255,255,255,.4);line-height:1.6}
.hu-fi{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:6px 7px;margin-bottom:5px;
  opacity:0;transform:translateY(-8px) scale(.9);transition:.4s cubic-bezier(.34,1.56,.64,1)}
.hub.pinned .hu-fi.p1{opacity:1;transform:none}
.hu-fi i{width:19px;height:19px;border-radius:5px;background:#E30613;font-style:normal;
  font-size:10px;display:flex;align-items:center;justify-content:center;flex:none}
.hu-fi b{font-size:9px;font-weight:600;color:#fff}
.hu-fa{margin-top:9px;padding-top:8px;border-top:1px solid rgba(255,255,255,.08)}
.hu-fa .t{color:#ff6168}

.hu-dog{position:absolute;right:12px;bottom:10px;display:flex;flex-direction:column;
  align-items:center;gap:5px;z-index:3}
.hu-dog .bg{background:#E30613;color:#fff;font-size:10px;font-weight:700;padding:4px 10px;
  border-radius:10px;white-space:nowrap;box-shadow:0 0 12px rgba(227,6,19,.55)}
.hu-dog .bg em{background:rgba(255,255,255,.25);border-radius:6px;padding:0 4px;
  font-style:normal;margin-left:2px}
.hu-dog img{width:66px;display:block;filter:drop-shadow(0 5px 7px rgba(0,0,0,.5))}

/* ---------- 總覽 ---------- */
#grid{position:absolute;inset:0;background:rgba(10,10,14,.97);display:none;
  padding:50px 60px;overflow:auto;z-index:40}
#grid.on{display:block}
.gwrap{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-top:26px}
.gcell{background:#1b1b22;border:1px solid rgba(255,255,255,.1);padding:16px;cursor:pointer;
  color:#fff;min-height:104px;text-align:left;font-family:var(--zh)}
.gcell:hover{border-color:var(--red);background:#26262f}
.gcell .n{font-family:var(--en);font-size:14px;color:var(--red);letter-spacing:2px}
.gcell .t{font-size:19px;font-weight:700;margin-top:8px;line-height:1.4}
.gcell.now{border-color:var(--red);background:#2d151a}

/* ---------- 講稿 / 編輯器 ---------- */
#notes{position:absolute;left:0;right:0;bottom:0;background:rgba(16,16,20,.97);color:#E8E8EF;
  padding:26px 90px;font-size:21px;line-height:1.7;display:none;z-index:35;
  border-top:3px solid var(--red);max-height:38%;overflow:auto}
#notes.on{display:block}
#notes b{color:var(--red);font-family:var(--en);letter-spacing:3px;font-size:15px;display:block;margin-bottom:8px}

#editor{position:absolute;inset:0;background:rgba(10,10,14,.98);z-index:60;display:none;
  padding:40px 60px;flex-direction:column;color:#fff}
#editor.on{display:flex}
#editor h2{font-size:30px;font-weight:900}
#editor p{color:#9A9AA6;font-size:19px;margin:10px 0 18px;line-height:1.6}
#editor textarea{flex:1;background:#15151b;color:#C8E6C9;border:1px solid #33333d;
  padding:18px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;line-height:1.6;resize:none}
#editor .row{display:flex;gap:14px;margin-top:18px;align-items:center}
.btn{background:var(--red);color:#fff;border:none;padding:14px 30px;font-size:19px;font-weight:900;
  cursor:pointer;font-family:var(--zh);transform:skewX(-18deg)}
.btn span{display:block;transform:skewX(18deg)}
.btn.ghost{background:#2a2a33}
#edmsg{color:#C8811A;font-size:18px}

/* ---------- 計時器 / 提示 ---------- */
#timer{position:absolute;right:26px;top:22px;font-family:var(--en);font-weight:700;font-size:26px;
  color:var(--red);background:rgba(255,255,255,.9);padding:6px 16px;display:none;z-index:30}
#timer.on{display:block}
#help,#src{position:fixed;bottom:10px;z-index:70;font-family:var(--en);font-size:12px;
  letter-spacing:2px;color:#4A4A55;background:rgba(0,0,0,.55);padding:5px 12px;
  opacity:0;transition:opacity .3s;pointer-events:none}
#help{left:12px} #src{right:12px;letter-spacing:1px}
body.peek #help, body.peek #src{opacity:1}
</style>
</head>

var DATA = null, ROUTE = null, IDX = 0, STEP = 0, SLIDES = [];
var $ = function(id){ return document.getElementById(id); };
var esc = function(s){ return String(s == null ? '' : s); };

/* ---------- 載入 ---------- */
function boot(){
  var done = false;
  function useFallback(why){
    if (done) return; done = true;
    try { setData(FALLBACK, '內建快照（' + (why || '抓不到外部檔') + '）'); }
    catch(e){ showFatal(e); }
  }
  try {
    if (typeof fetch !== 'function') return useFallback('瀏覽器不支援 fetch');
    fetch('deck-data.json', {cache:'no-store'})
      .then(function(r){ if(!r.ok) throw 0; return r.json(); })
      .then(function(j){ if (done) return; done = true; setData(j, '外部 deck-data.json'); })
      .catch(function(){ useFallback(); });
    setTimeout(function(){ useFallback('外部檔逾時'); }, 3000);   // ★ 3 秒保底，絕不空白
  } catch(e){ useFallback('讀取失敗'); }
}

/* ★ 真的爆了就把錯誤印在畫面上，不要留一片白 */
function showFatal(e){
  var d = $('deck');
  if (d) d.innerHTML = '<div class="slide on" style="padding:80px 96px">' +
    '<div class="h1">簡報載入失敗</div>' +
    '<div class="lead">請按 F12 看 Console，或把下面這行貼給工程師。</div>' +
    '<div class="rule"></div><div style="font-size:20px;color:#8a8a92;font-family:monospace">' +
    String(e && (e.stack || e.message) || e).slice(0, 400) + '</div></div>';
}
addEventListener('error', function(ev){ if (!SLIDES.length) showFatal(ev.error || ev.message); });
function setData(j, src){
  DATA = j;
  $('src').textContent = '資料來源：' + src + ' ｜ ' + esc(j.meta && j.meta.ver);
  renderRoutes();
  // ★ 網址指定 > 預設路線；都沒有才停在選單
  var q = (location.search.match(/[?&]route=([^&]+)/) || [])[1];
  var go = q ? decodeURIComponent(q) : ((j.meta && j.meta.defaultRoute) || '');
  if (go && (j.routes || []).some(function(r){ return r.id === go; })) pick(go);
}

/* ---------- 路線選單 ---------- */
function renderRoutes(){
  var m = DATA.meta || {}, rs = DATA.routes || [];
  var h = '<div class="eyebrow">// Select Route</div>' +
          '<div class="h1">' + esc(m.title) + '</div>' +
          '<div class="lead">今天要帶誰走？點一個開始。</div><div class="rt-grid">';
  rs.forEach(function(r, i){
    h += '<button class="rt' + (r.hot?' hot':'') + (r.dev?' dev':'') + '" onclick="pick(\'' + r.id + '\')">' +
         '<div class="mk"></div><b>' + esc(r.name) + '</b><small>' + esc(r.desc) + '</small></button>';
  });
  h += '</div>';
  $('routes').innerHTML = h;
  $('routes').classList.add('on');
  $('deck').innerHTML = '';
}

function pick(id){
  ROUTE = id;
  SLIDES = (DATA.slides || []).filter(function(s){
    if (id === '_dev') return true;
    var r = s.roles || ['*'];
    return r.indexOf('*') > -1 || r.indexOf(id) > -1;
  });
  IDX = 0; STEP = 0;
  $('routes').classList.remove('on');
  buildDeck();
  show();
}

function routeName(){
  var r = (DATA.routes || []).filter(function(x){ return x.id === ROUTE; })[0];

/* ---------- 顯示 / 逐步展開 ---------- */
var MIN_K = 0.9;   // ★ 投影可讀下限；再放不下就是那頁該拆，不縮圖
function autofit(){
  var sl = $('deck').querySelector('.slide.on'); if (!sl) return;
  sl.querySelectorAll('.items, .caps').forEach(function(box){
    var k = 1; box.style.setProperty('--k', 1);
    while (box.scrollHeight > box.clientHeight + 4 && k > MIN_K){
      k = Math.round((k - 0.02) * 100) / 100;
      box.style.setProperty('--k', k);
    }
  });
}
function refit(){ requestAnimationFrame(function(){ requestAnimationFrame(autofit); }); }
function show(){
  var all = $('deck').querySelectorAll('.slide');
  for (var i=0;i<all.length;i++) all[i].classList.toggle('on', i === IDX);
  autofit(); refit();
  // ★ 這頁的圖載完要再量一次，否則量到的是「圖還沒出現」的高度
  var on = $('deck').querySelector('.slide.on');
  if (on) on.querySelectorAll('img').forEach(function(im){
    if (!im.complete) { im.addEventListener('load', refit, {once:true});
                        im.addEventListener('error', refit, {once:true}); }
  });
  applySteps();
  renderNotes();
  if (ROUTE === '_dev') expandAll();
}
function steps(){ return $('deck').querySelectorAll('.slide.on .step'); }

  '</div>';
}

/* 自己的圖：依 STEP 移動聚光燈框 */
function setShot(sl){
  var sh = sl.querySelector('.shot'); if (!sh) return;
  var sp = sh.querySelector('.spot'); if (!sp) return;
  var s = SLIDES[IDX] || {}, cf = (s.steps || [])[Math.max(0, STEP-1)] || {};
  var b = (STEP > 0) ? cf.box : null;
  if (!b || b.length !== 4){ sp.classList.remove('on'); return; }
  sp.style.left = b[0] + '%'; sp.style.top = b[1] + '%';
  sp.style.width = b[2] + '%'; sp.style.height = b[3] + '%';
  sp.classList.add('on');
}

/* 作業中心：依 STEP 聚焦 / 釘選 */
function setHub(sl){
  var hb = sl.querySelector('.hub'); if (!hb) return;
  var s = SLIDES[IDX] || {}, cf = (s.steps || [])[Math.max(0, STEP-1)] || {};
  var f = (STEP > 0) ? (cf.focus || '') : '';
  hb.classList.toggle('focusing', !!f);
  hb.classList.toggle('pinned', !!cf.pinned);
  var fe = hb.querySelector('#hu-fe');
  if (fe) fe.style.display = cf.pinned ? 'none' : 'block';
  hb.querySelectorAll('.part').forEach(function(p){
    p.classList.toggle('hit', !!f && p.getAttribute('data-p') === f);
  });
}

/* 活介面：依 STEP 推進手機畫面 */
function setPhone(){
  var sl = $('deck').querySelector('.slide.on'); if (!sl) return;
  setHub(sl); setShot(sl); setBook(sl);
  var ph = sl.querySelector('.phone'); if (!ph) return;
  var s = SLIDES[IDX] || {}, cf = (s.steps || [])[Math.max(0, STEP-1)] || {};
  var st = cf.state || 'idle';
  var cIn = ph.querySelector('[data-c=in]'),  tIn  = cIn.querySelector('.pu-time');
  var cOut= ph.querySelector('[data-c=out]'), tOut = cOut.querySelector('.pu-time');
  var bIn = ph.querySelector('.pu-btn.i'),    bOut = ph.querySelector('.pu-btn.o');
  var hint= ph.querySelector('.pu-hint');
  function set(b, off, zh, en){
    b.classList.toggle('off', !!off);
    b.querySelector('.zh').textContent = zh;
    b.querySelector('.en2').textContent = en;
  }
  var inDone  = (st === 'in' || st === 'out');
  var outDone = (st === 'out');
  tIn.textContent  = inDone  ? '08:12:03' : '--:--:--';
  tOut.textContent = outDone ? '18:04:22' : '--:--:--';
  cIn.classList.toggle('done', inDone);
  cOut.classList.toggle('done', outDone);
  set(bIn,  inDone,  inDone  ? '早安，今天加油' : '上班打卡', inDone  ? '記得吃早餐 · 08:12:03'   : '// CLOCK IN //');
  set(bOut, outDone, outDone ? '今天辛苦了'     : '下班打卡', outDone ? '回家路上請小心 · 18:04:22' : '// CLOCK OUT //');
  hint.textContent = cf.hint || '';
}
function applySteps(){
  var st = steps();
  for (var i=0;i<st.length;i++) st[i].classList.toggle('shown', i < STEP);
  setPhone();
}
function expandAll(){ STEP = steps().length; applySteps(); }

function next(){
  if (STEP < steps().length){ STEP++; applySteps(); return; }
  if (IDX < SLIDES.length - 1){ IDX++; STEP = 0; show(); }
}
function prev(){
  if (STEP > 0){ STEP--; applySteps(); return; }
  if (IDX > 0){ IDX--; show(); expandAll(); }   // 退回上一頁自動全展開
}
function goto(i){ IDX = i; STEP = 0; show(); closeGrid(); }


/* ---------- 總覽 ---------- */
function toggleGrid(){
  var g = $('grid');
  if (g.classList.contains('on')) return closeGrid();
  var h = '<div class="eyebrow">// Overview</div><div class="h1" style="color:#fff">' +
          routeName() + '　共 ' + SLIDES.length + ' 頁</div><div class="gwrap">';
  SLIDES.forEach(function(s,i){
    h += '<button class="gcell' + (i===IDX?' now':'') + '" onclick="goto(' + i + ')">' +
         '<div class="n">' + (i+1) + '</div><div class="t">' + esc(s.title || s.sub || '—') + '</div></button>';
  });
  g.innerHTML = h + '</div>';
  g.classList.add('on');
}
function closeGrid(){ $('grid').classList.remove('on'); }

/* ---------- 講稿 ---------- */
var NOTE_ON = false;
function renderNotes(){
  var s = SLIDES[IDX] || {};
  $('notes').innerHTML = '<b>// 講稿</b>' + (s.notes || '（這頁沒有講稿）');
  $('notes').classList.toggle('on', NOTE_ON);
}
function toggleNotes(){ NOTE_ON = !NOTE_ON; renderNotes(); }

/* ---------- 計時器 ---------- */
var T0 = null, TI = null;
function toggleTimer(){
  if (TI){ clearInterval(TI); TI = null; $('timer').classList.remove('on'); return; }
  T0 = Date.now(); $('timer').classList.add('on');
  TI = setInterval(function(){
    var s = Math.floor((Date.now()-T0)/1000), p = function(n){ return (n<10?'0':'')+n; };
    $('timer').textContent = p(Math.floor(s/60)) + ':' + p(s%60);
  }, 500);
}

/* ---------- 內容編輯器（展示「可更新」用） ---------- */
function toggleEditor(on){
  if (on){ $('edtext').value = JSON.stringify(DATA, null, 2); $('edmsg').textContent = ''; }
  $('editor').classList.toggle('on', !!on);
}
function applyEdit(){
  try{
    var j = JSON.parse($('edtext').value);
    setData(j, '手動貼上');
    toggleEditor(false);
  }catch(e){
    $('edmsg').textContent = 'JSON 格式有誤：' + e.message;
  }
}

/* ---------- 縮放：固定 1600×900 舞台 ---------- */
function fit(){
  var s = Math.min(innerWidth/1600, innerHeight/900);
  $('stage').style.transform = 'scale(' + s + ')';
}
addEventListener('resize', function(){ fit(); autofit(); });

/* ---------- 操作 ---------- */
addEventListener('keydown', function(e){
  var k = e.key;
  if ($('editor').classList.contains('on')){ if (k === 'Escape') toggleEditor(false); return; }
  if (!ROUTE){ return; }
  if (k === 'ArrowRight' || k === 'PageDown' || k === ' '){ e.preventDefault(); next(); }
  else if (k === 'ArrowLeft' || k === 'PageUp'){ e.preventDefault(); prev(); }
  else if (k === 'ArrowDown'){ e.preventDefault(); expandAll(); }
  else if (k === 'o' || k === 'O'){ toggleGrid(); }
  else if (k === 'n' || k === 'N'){ toggleNotes(); }
  else if (k === 't' || k === 'T'){ toggleTimer(); }
  else if (k === 'e' || k === 'E'){ toggleEditor(true); }
  else if (k === 'r' || k === 'R'){ ROUTE = null; closeGrid(); renderRoutes(); }
  else if (k === 'f' || k === 'F'){
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen();
  }
  else if (k === 'Escape'){ closeGrid(); }
});
$('viewport').addEventListener('click', function(e){
  if (!ROUTE) return;
  if (e.target.closest('#editor,#grid,#routes,.btn')) return;
  next();
});
$('viewport').addEventListener('contextmenu', function(e){ e.preventDefault(); prev(); });

/* 滑鼠動才顯示角落提示，投影時乾淨 */
var _pk = null;
addEventListener('mousemove', function(){
  document.body.classList.add('peek');
  clearTimeout(_pk);
  _pk = setTimeout(function(){ document.body.classList.remove('peek'); }, 2500);
});

/* 網址帶路線：?route=qc 直接開 */
fit();
boot();
/* ★ 字型載入時序坑：中文字型還沒到就量高度會算錯 → 多點保底重量 */
if (document.fonts){
  try{
    Promise.all([
      document.fonts.load('900 64px "Noto Sans TC"'),
      document.fonts.load('400 24px "Noto Sans TC"'),
      document.fonts.load('700 20px "Chakra Petch"')
    ]).then(refit).catch(function(){});
  }catch(e){}
  if (document.fonts.ready) document.fonts.ready.then(refit);
}
addEventListener('load', refit);
[300, 900, 2000].forEach(function(t){ setTimeout(refit, t); });   // 保底：不管什麼原因沒量到，這三槍補上

</script>
